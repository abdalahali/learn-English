      title: 'File changed outside the notebook',
      message: 'This file was modified by another program while you have unsaved edits here. Load the version from disk (your edits here are lost), or keep your edits and overwrite the file?',
      cancelText: 'Keep my edits', confirmText: 'Load from disk', danger: true
    });
    if (load) { await reloadFromDisk(file); return 'loaded'; }
    lastKnownModified = file.lastModified;
    return 'kept';
  } finally { conflictOpen = false; }
}

// Asks to save first; resolves false only if the user chooses to stop.
async function guardUnsaved(actionText) {
  if (dirty && fileHandle) {
    await saveFile(true);
    if (dirty) {
      return await showConfirm('Some changes could not be saved to the file. ' + actionText + ' anyway?', 'Unsaved changes', 'Continue anyway', true);
    }
  }
  return true;
}

function scheduleAutosave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveFile(false), 800);
}
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

function applyTheme() {
  const s = Object.assign(defaultSettings(), doc.settings || {});
  document.documentElement.setAttribute('data-theme', s.theme === 'dark' ? 'dark' : 'light');
  document.documentElement.style.setProperty('--writing-accent', s.writingColor);
  document.documentElement.style.setProperty('--table-accent', s.tableColor);
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', s.theme === 'dark' ? '#131418' : '#FFFFFF');
}

/* =====================================================================
   FILE HANDLING: single file
===================================================================== */
async function openSingleFile() {
  if (!CAP_OPEN) return;
  if (!(await guardUnsaved('Open another file'))) return;
  try {
    const [handle] = await window.showOpenFilePicker({ mode: 'readwrite', types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }] });
    // Check permission silently without triggering the initial browser permission prompt modal
    try {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      fileHasWritePermission = (perm === 'granted');
    } catch (pe) {
      fileHasWritePermission = false;
    }
    workspaceHandle = null; workspaceFiles = []; activeFileName = null;
    const loaded = await readDocFromHandle(handle);
    doc = loaded.doc;
    fileHandle = handle;
    hasConnection = true; dirty = false;
    activeSectionId = (doc.sections[0] && doc.sections[0].id) || null;
    saveToLocalStorage();
    idbSet('lastType', 'file'); idbSet('lastFileHandle', handle);
    applyTheme();
    setStatus('saved', 'Connected \u2014 ' + (handle.name || 'file.md'));
    renderAll();
    afterRestore(loaded.restored);
  } catch (e) { /* cancelled */ }
}

async function saveFile(fromUserGesture) {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  saveToLocalStorage();
  if (!fileHandle) return;
  try {
    const ext = await checkExternalChange();
    if (ext === 'loaded') return;
    let perm = 'prompt';
    try { perm = await fileHandle.queryPermission({ mode: 'readwrite' }); } catch (pe) {}

    if (perm !== 'granted') {
      if (fromUserGesture) {
        perm = await fileHandle.requestPermission({ mode: 'readwrite' });
        fileHasWritePermission = (perm === 'granted');
      } else {
        // Do NOT call createWritable() on a background timer if permission is not granted!
        // That is what causes Chrome's security modal to pop up mid-typing!
        fileHasWritePermission = false;
        setStatus('unsaved', 'Unsaved \u2014 click Save');
        renderTopbarActions();
        return;
      }
    } else {
      fileHasWritePermission = true;
    }

    if (perm !== 'granted') {
      fileHasWritePermission = false;
      setStatus('unsaved', 'Permission needed \u2014 click Save');
      renderTopbarActions();
      return;
    }

    saving = true;
    try {
      const writable = await fileHandle.createWritable();
      await writable.write(serializeMarkdown(doc));
      await writable.close();
      try { lastKnownModified = (await fileHandle.getFile()).lastModified; } catch (me) {}
    } finally { saving = false; }
    dirty = false;
    fileHasWritePermission = true;
    await idbDel(draftKey(fileHandle.name));
    setStatus('saved', 'Saved \u2014 ' + (fileHandle.name || 'file.md'));
    renderTopbarActions();
  } catch (e) {
    setStatus('error', 'Couldn\u2019t save (check permission)');
    renderTopbarActions();
  }
}

async function closeFile() {
  if (!(await guardUnsaved('Close the file'))) return;
  fileHandle = null; workspaceHandle = null; workspaceFiles = []; activeFileName = null;
  hasConnection = false; dirty = false;
  doc = { title: 'My Notebook', settings: defaultSettings(), sections: [] };
  setSidebarMode('sections'); reorderMode = false;
  applyTheme();
  setStatus('', 'No file connected');
  renderAll();
}

/* =====================================================================
   WORKSPACE
===================================================================== */
async function scanWorkspaceFiles() {
  workspaceFiles = [];
  if (!workspaceHandle) return;
  for await (const [name, handle] of workspaceHandle.entries()) {
    if (handle.kind === 'file' && /\.md$/i.test(name)) workspaceFiles.push({ name, handle });
  }
  workspaceFiles.sort((a, b) => a.name.localeCompare(b.name));
}

function cleanAppHtml() {
  // Serialise a pristine copy of the page (no rendered notes, no open dialogs).
  const c = document.documentElement.cloneNode(true);
  const q = (sel) => c.querySelector(sel);
  ['#content-inner', '#section-nav', '#workspace-file-list', '#topbar-actions', '#modal-files-list'].forEach(sel => { const el = q(sel); if (el) el.innerHTML = ''; });
  const mirror = q('#writing-area-mirror'); if (mirror) mirror.remove();
  const bodyEl = q('body'); if (bodyEl) bodyEl.classList.remove('drawer-open');
  ['#hl-panel', '#shortcuts-overlay'].forEach(sel => { const el = q(sel); if (el) el.remove(); });
  c.querySelectorAll('.open').forEach(el => el.classList.remove('open'));
  c.removeAttribute('style'); c.removeAttribute('data-theme');
  const ti = q('#doc-title-input'); if (ti) { ti.setAttribute('value', 'My Notebook'); ti.setAttribute('readonly', 'true'); }
  const st = q('#status-text'); if (st) st.textContent = 'No file connected';
  const sd = q('#status-dot'); if (sd) sd.className = 'status-dot';
  const ps = q('#panel-sections'); if (ps) ps.classList.remove('hide-left');
  const pf = q('#panel-files'); if (pf) pf.classList.add('hide-right');
  const wp = q('#workspace-pill'); if (wp) wp.style.display = 'none';
  const rb = q('#reorder-banner'); if (rb) rb.style.display = 'none';
  c.querySelectorAll('.reorder-mode').forEach(el => el.classList.remove('reorder-mode'));
  ['#settings-menu', '#section-options-popover', '#color-popover'].forEach(sel => { const el = q(sel); if (el) el.removeAttribute('style'); });
  return '<!DOCTYPE html>\n' + c.outerHTML;
}

async function writeAppCopyIntoWorkspace(dirHandle) {
  try {
    const htmlHandle = await dirHandle.getFileHandle('notebook.html', { create: true });
    const writable = await htmlHandle.createWritable();
    await writable.write(cleanAppHtml());
    await writable.close();
  } catch (e) { /* non-fatal: workspace still works without a bundled copy */ }
}

async function createFirstFileIn(dirHandle, suggestedTitle) {
  const name = await showPrompt('Name your first file', 'e.g. My Notebook', suggestedTitle || 'My Notebook');
  if (!name) return null;
  const fileName = sanitizeFileName(name) + '.md';
  const handle = await dirHandle.getFileHandle(fileName, { create: true });
  const newDoc = { title: name, settings: Object.assign(defaultSettings(), doc.settings), sections: [] };
  const writable = await handle.createWritable();
  await writable.write(serializeMarkdown(newDoc));
  await writable.close();
  return { handle, fileName, newDoc };
}

async function openWorkspace() {
  if (!CAP_DIR) return;
  let dirHandle;
  try { dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' }); }
  catch (e) { return; }

  workspaceHandle = dirHandle;
  fileHasWritePermission = true;
  let restoredDraft = false;
  await scanWorkspaceFiles();

  if (workspaceFiles.length === 0) {
    await writeAppCopyIntoWorkspace(dirHandle);
    const created = await createFirstFileIn(dirHandle);
    if (!created) { workspaceHandle = null; return; }
    fileHandle = created.handle; activeFileName = created.fileName; doc = created.newDoc;
    await scanWorkspaceFiles();
  } else {
    const remembered = await idbGet('lastWorkspaceFile');
    const pick = workspaceFiles.find(f => f.name === remembered) || workspaceFiles[0];
    const loaded = await readDocFromHandle(pick.handle);
    doc = loaded.doc; restoredDraft = loaded.restored;
    fileHandle = pick.handle; activeFileName = pick.name;
  }

  hasConnection = true; dirty = false; sidebarMode = 'sections';
  idbSet('lastType', 'workspace'); idbSet('lastWorkspaceHandle', dirHandle); idbSet('lastWorkspaceFile', activeFileName);
  applyTheme();
  setStatus('saved', 'Workspace connected \u2014 ' + activeFileName);
  renderAll();
  afterRestore(restoredDraft);
}

async function switchWorkspaceFile(name) {
  if (name === activeFileName) { setSidebarMode('sections'); renderAll(); return; }
  if (dirty && fileHandle) await saveFile();
  const entry = workspaceFiles.find(f => f.name === name);
  if (!entry) return;
  const loaded = await readDocFromHandle(entry.handle);
  doc = loaded.doc;
  fileHandle = entry.handle;
  fileHasWritePermission = true;
  activeFileName = name;
  dirty = false;
  setSidebarMode('sections');
  idbSet('lastWorkspaceFile', name);
  applyTheme();
  setStatus('saved', 'Saved \u2014 ' + name);
  renderAll();
  afterRestore(loaded.restored);
}

async function createFileInWorkspace() {
  if (guardLocked()) return;
  const name = await showPrompt('New file', 'e.g. Vocabulary', 'Untitled');
  if (!name) return;
  const fileName = sanitizeFileName(name) + '.md';
  if (workspaceFiles.some(f => f.name.toLowerCase() === fileName.toLowerCase())) {
    await showAlert('A file with that name already exists in this workspace.', 'Name taken');
    return;
  }
  if (dirty && fileHandle) await saveFile();
  const handle = await workspaceHandle.getFileHandle(fileName, { create: true });
  const newDoc = { title: name, settings: Object.assign(defaultSettings(), doc.settings), sections: [] };
  const writable = await handle.createWritable();
  await writable.write(serializeMarkdown(newDoc));
  await writable.close();
  await scanWorkspaceFiles();
  await switchWorkspaceFile(fileName);
}

/* =====================================================================
   RECONNECT ON LOAD (silent if permission granted; otherwise fresh)
===================================================================== */
function reconcileActiveSection(previousDoc, previousActiveId) {
  const prevSec = previousDoc && previousDoc.sections && previousDoc.sections.find(s => s.id === previousActiveId);
  if (prevSec) {
    const match = doc.sections.find(s => s.title === prevSec.title);
    if (match) return match.id;
  }
  return (doc.sections[0] && doc.sections[0].id) || null;
}

async function connectWorkspaceHandle(dirHandle) {
  const prevDoc = doc, prevActiveId = activeSectionId;
  let restoredDraft = false;
  workspaceHandle = dirHandle;
  fileHasWritePermission = true;
  await scanWorkspaceFiles();
  if (workspaceFiles.length > 0) {
    const remembered = await idbGet('lastWorkspaceFile');
    const pick = workspaceFiles.find(f => f.name === remembered) || workspaceFiles[0];
    const loaded = await readDocFromHandle(pick.handle);
    doc = loaded.doc; restoredDraft = loaded.restored;
    fileHandle = pick.handle; activeFileName = pick.name;
  } else {
    doc = { title: 'My Notebook', settings: defaultSettings(), sections: [] };
  }
  hasConnection = true; dirty = false;
  activeSectionId = reconcileActiveSection(prevDoc, prevActiveId);
  setStatus('saved', 'Workspace connected \u2014 ' + (activeFileName || ''));
  saveToLocalStorage();
  applyTheme();
  afterRestore(restoredDraft);
}

async function connectFileHandle(handle) {
  const prevDoc = doc, prevActiveId = activeSectionId;
  workspaceHandle = null;
  const loaded = await readDocFromHandle(handle);
  doc = loaded.doc;
  fileHandle = handle; hasConnection = true; dirty = false;
  fileHasWritePermission = true;
  activeSectionId = reconcileActiveSection(prevDoc, prevActiveId);
  setStatus('saved', 'Connected \u2014 ' + (handle.name || 'file.md'));
  saveToLocalStorage();
  applyTheme();
  afterRestore(loaded.restored);
}

async function reconnectPending() {
  if (!pendingReconnect) return;
  const { type, handle } = pendingReconnect;
  try {
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      pendingReconnect = null;
      renderAll();
      return;
    }
    if (type === 'workspace') await connectWorkspaceHandle(handle);
    else await connectFileHandle(handle);
    pendingReconnect = null;
    renderAll();
  } catch (e) {
    await showAlert('Could not reconnect. Please open the file or workspace again.', 'Reconnect failed');
    pendingReconnect = null;
    renderAll();
  }
}

async function tryReconnect() {
  if (!CAP_ANY) { renderAll(); return; }
  try {
    const type = await idbGet('lastType');
    if (type === 'workspace' && CAP_DIR) {
      const dirHandle = await idbGet('lastWorkspaceHandle');
      if (dirHandle) {
        let perm = 'prompt';
        try { perm = await dirHandle.queryPermission({ mode: 'readwrite' }); } catch (pe) {}
        if (perm === 'granted') {
          await connectWorkspaceHandle(dirHandle);
          renderAll();
          return;
        } else {
          pendingReconnect = { type: 'workspace', handle: dirHandle, name: dirHandle.name || 'Workspace' };
        }
      }
    } else if (type === 'file' && CAP_OPEN) {
      const handle = await idbGet('lastFileHandle');
      if (handle) {
        let perm = 'prompt';
        try { perm = await handle.queryPermission({ mode: 'readwrite' }); } catch (pe) {}
        if (perm === 'granted') {
          await connectFileHandle(handle);
          renderAll();
          return;
        } else {
          pendingReconnect = { type: 'file', handle: handle, name: handle.name || 'file.md' };
        }
      }
    }
  } catch (e) {
    // Permission query failed or handle stale
  }
  renderAll();
}

/* =====================================================================
   SECTION / COLUMN / ROW OPERATIONS
===================================================================== */
function guardLocked() {
  if (isFileLocked) { showAlert('This file is locked. Unlock it in Settings to make changes.', 'File locked'); return true; }
  return false;
}

/* Inline rename with Confirm / Cancel buttons. Enter or the tick confirms, Esc or the cross cancels,
   clicking elsewhere confirms. The buttons keep focus on mousedown so the mouse always works. */
function startInlineRename(input, onCommit) {
  if (!input || input._renaming) return;
  input._renaming = true;
  const original = input.value;
  let done = false;
  const actions = document.createElement('span');
  actions.className = 'rename-actions';
  const mk = (cls, label, svg) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = cls; b.title = label; b.setAttribute('aria-label', label); b.innerHTML = svg;
    b.addEventListener('mousedown', (e) => e.preventDefault());
    return b;
  };
  const okBtn = mk('ok', 'Confirm (Enter)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>');
  const noBtn = mk('cancel', 'Cancel (Esc)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>');
  actions.appendChild(okBtn); actions.appendChild(noBtn);
  const finish = (save) => {
    if (done) return; done = true;
    input.removeEventListener('keydown', onKey);
    input.removeEventListener('blur', onBlur);
    input.readOnly = true; input.setAttribute('readonly', 'true');
    input._renaming = false;
    actions.remove();
    const v = input.value.trim();
    if (save && v && v !== original) { input.value = v; onCommit(v); }
    else { input.value = original; }
  };
  const onKey = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
  };
  const onBlur = () => finish(true);
  okBtn.addEventListener('click', () => finish(true));
  noBtn.addEventListener('click', () => finish(false));
  input.addEventListener('keydown', onKey);
  input.addEventListener('blur', onBlur);
  input.readOnly = false; input.removeAttribute('readonly');
  input.insertAdjacentElement('afterend', actions);
  input.focus();
  input.select();
}

function addSection(type, title) {
  if (guardLocked()) return;
  const s = Object.assign(defaultSettings(), doc.settings || {});
  const color = type === 'table' ? s.tableColor : s.writingColor;
  const sec = { id: uid('s'), type: type, title: title || (type === 'table' ? 'New table' : 'New writing space'), color: color };
  if (type === 'table') {
    const c1 = { id: uid('c'), name: '', color: DEFAULT_PALETTE[0] };
    const c2 = { id: uid('c'), name: '', color: DEFAULT_PALETTE[1] };
    sec.columns = [c1, c2];
    sec.rows = [{ id: uid('r'), cells: { [c1.id]: '', [c2.id]: '' } }];
  } else {
    sec.content = '';
  }
  doc.sections.push(sec);
  activeSectionId = sec.id;
  isEditMode = true;
  markDirty();
  renderAll();
  requestAnimationFrame(() => {
    const cardEl = document.getElementById('card-' + sec.id);
    safeScrollIntoView(cardEl, { behavior: 'smooth', block: 'start' });
    if (cardEl) {
      cardEl.classList.add('card-enter');
      cardEl.addEventListener('animationend', () => cardEl.classList.remove('card-enter'), { once: true });
    }
  });
}

async function deleteSection(id) {
  if (guardLocked()) return;
  const sec = doc.sections.find(s => s.id === id);
  if (!sec) return;
  const ok = await showConfirm('This removes the whole "' + sec.title + '" section and everything in it.', 'Delete this section?', 'Delete', true);
  if (!ok) return;
  const idx = doc.sections.findIndex(s => s.id === id);
  doc.sections = doc.sections.filter(s => s.id !== id);
  if (activeSectionId === id) {
    const nextSec = doc.sections[idx] || doc.sections[idx - 1] || doc.sections[0] || null;
    activeSectionId = nextSec ? nextSec.id : null;
  }
  markDirty();
  renderAll();
}

function addColumn(sec) {
  const col = { id: uid('c'), name: '', color: DEFAULT_PALETTE[sec.columns.length % DEFAULT_PALETTE.length] };
  sec.columns.push(col);
  sec.rows.forEach(r => { r.cells[col.id] = ''; });
  markDirty();
  renderAll();
}

async function deleteColumn(sec, colId) {
  if (sec.columns.length <= 1) { await showAlert('A table needs at least one column.', 'Can\u2019t delete'); return; }
  const col = sec.columns.find(c => c.id === colId);
  const ok = await showConfirm('This removes the "' + (col && col.name ? col.name : 'unnamed') + '" column and its content from every row.', 'Delete this column?', 'Delete', true);
  if (!ok) return;
  sec.columns = sec.columns.filter(c => c.id !== colId);
  sec.rows.forEach(r => { delete r.cells[colId]; });
  markDirty();
  renderAll();
}

function addRow(sec, afterRowId) {
  if (isFileLocked || !isEditMode) return;
  const cells = {};
  sec.columns.forEach(c => { cells[c.id] = ''; });
  const row = { id: uid('r'), cells };
  if (afterRowId) {
    const idx = sec.rows.findIndex(r => r.id === afterRowId);
    sec.rows.splice(idx + 1, 0, row);
  } else {
    sec.rows.push(row);
  }
  markDirty();
  renderAll();
  requestAnimationFrame(() => {
    const el = document.querySelector('textarea[data-row="' + row.id + '"]');
    if (el) el.focus();
  });
}

function deleteRow(sec, rowId) {
  sec.rows = sec.rows.filter(r => r.id !== rowId);
  markDirty();
  renderAll();
}

/* =====================================================================
   COLOR POPOVER
===================================================================== */
function openColorPopover(anchorEl, currentColor, onPick) {
  const pop = document.getElementById('color-popover');
  const grid = document.getElementById('swatch-grid');
  grid.innerHTML = '';
  DEFAULT_PALETTE.forEach(color => {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'swatch' + (color.toLowerCase() === String(currentColor).toLowerCase() ? ' selected' : '');
    sw.style.background = color;
    sw.onclick = () => { onPick(color); closeColorPopover(); };
    grid.appendChild(sw);
  });
  const customInput = document.getElementById('custom-color-input');
  customInput.value = /^#[0-9a-fA-F]{6}$/.test(currentColor) ? currentColor : '#7A2E38';
  customInput.oninput = () => onPick(customInput.value);
  const rect = anchorEl.getBoundingClientRect();
  pop.style.left = Math.min(rect.left, window.innerWidth - 200) + 'px';
  pop.style.top = (rect.bottom + 8) + 'px';
  pop.classList.add('open');
  setTimeout(() => document.addEventListener('mousedown', outsidePopoverClick), 0);
}
function closeColorPopover() {
  document.getElementById('color-popover').classList.remove('open');
  document.removeEventListener('mousedown', outsidePopoverClick);
}
function outsidePopoverClick(e) {
  const pop = document.getElementById('color-popover');
  if (!pop.contains(e.target)) closeColorPopover();
}

/* =====================================================================
   RENDERING
===================================================================== */
function renderAll() {
  renderTopbarActions();
  renderSidebar();
  renderContent();
  document.getElementById('doc-title-input').value = doc.title || 'My Notebook';
}

function renderTopbarActions() {
  const wrap = document.getElementById('topbar-actions');
  wrap.innerHTML = '';

  if (!hasConnection) {
    if (pendingReconnect) return;
    if (CAP_OPEN) {
      const b = document.createElement('button');
      b.className = 'btn ghost small'; b.type = 'button';
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span class="btn-label">Open</span>';
      b.onclick = openSingleFile;
      wrap.appendChild(b);
    }
    if (CAP_DIR) {
      const b = document.createElement('button');
      b.className = 'btn solid small'; b.type = 'button';
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span class="btn-label">Workspace</span>';
      b.onclick = workspaceChoice;
      wrap.appendChild(b);
    }
    return;
  }

  // Read/Edit Mode Toggle in topbar
  const modeBtn = document.createElement('button');
  modeBtn.type = 'button';
  modeBtn.className = 'mode-pill-btn' + (isEditMode ? ' edit-active' : '') + (isFileLocked ? ' locked' : '');
  modeBtn.title = isFileLocked
    ? 'File is locked (unlock in Settings)'
    : (isEditMode ? 'Click to switch to Read mode (Ctrl+E)' : 'Click to switch to Edit mode (Ctrl+E)');
  if (isFileLocked) {
    modeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Locked</span>';
    modeBtn.onclick = () => { showAlert('This file is locked. Unlock it in Settings to make changes.', 'File locked'); };
  } else if (isEditMode) {
    modeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg><span>Edit</span>';
    modeBtn.onclick = () => { isEditMode = false; saveToLocalStorage(); renderAll(); };
  } else {
    modeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Read</span>';
    modeBtn.onclick = () => { isEditMode = true; saveToLocalStorage(); renderAll(); };
  }

async function renameWorkspaceFile(entry) {
  if (guardLocked()) return;
  const isActive = entry.name === activeFileName;
  if (isActive && dirty) await saveFile();

  const currentTitle = entry.name.replace(/\.md$/i, '');
  const newName = await showPrompt('Rename file', 'e.g. Vocabulary', currentTitle, 'Rename');
  if (!newName) return;
  const newFileName = sanitizeFileName(newName) + '.md';
  if (newFileName.toLowerCase() === entry.name.toLowerCase()) return;
  if (workspaceFiles.some(f => f.name.toLowerCase() === newFileName.toLowerCase())) {
    await showAlert('A file with that name already exists in this workspace.', 'Name taken');
    return;
  }

  try {
    const file = await entry.handle.getFile();
    const text = await file.text();
    const newHandle = await workspaceHandle.getFileHandle(newFileName, { create: true });
    const writable = await newHandle.createWritable();
    await writable.write(text);
    await writable.close();
    await workspaceHandle.removeEntry(entry.name);
    await scanWorkspaceFiles();

    if (isActive) {
      const updated = workspaceFiles.find(f => f.name === newFileName);
      fileHandle = updated ? updated.handle : newHandle;
      activeFileName = newFileName;
      try { lastKnownModified = (await fileHandle.getFile()).lastModified; } catch (me) {}
      idbSet('lastWorkspaceFile', newFileName);
      setStatus('saved', 'Saved \u2014 ' + newFileName);
    }
    renderWorkspaceFilesPanel();
    renderModalFilesList();
  } catch (e) {
    await showAlert('Could not rename this file.', 'Rename failed');
  }
}

async function deleteWorkspaceFile(entry) {
  if (guardLocked()) return;
  const ok = await showConfirm('Delete "' + entry.name.replace(/\.md$/i, '') + '"? This cannot be undone.', 'Delete file', 'Delete', true);
  if (!ok) return;

  try {
    await workspaceHandle.removeEntry(entry.name);
    try { await idbDel(draftKey(entry.name)); } catch (de) {}
    const wasActive = entry.name === activeFileName;
    await scanWorkspaceFiles();

    if (wasActive) {
      if (workspaceFiles.length > 0) {
        const next = workspaceFiles[0];
        const file = await next.handle.getFile();
        doc = parseMarkdown(await file.text());
        lastKnownModified = file.lastModified;
        fileHandle = next.handle;
        activeFileName = next.name;
      } else {
        const fileName = 'Untitled.md';
        const handle = await workspaceHandle.getFileHandle(fileName, { create: true });
        const newDoc = { title: 'Untitled', settings: Object.assign(defaultSettings(), doc.settings), sections: [] };
        const writable = await handle.createWritable();
        await writable.write(serializeMarkdown(newDoc));
        await writable.close();
        fileHandle = handle; activeFileName = fileName; doc = newDoc;
        try { lastKnownModified = (await handle.getFile()).lastModified; } catch (me) {}
        await scanWorkspaceFiles();
      }
      dirty = false;
      idbSet('lastWorkspaceFile', activeFileName);
      applyTheme();
      setStatus('saved', 'Saved \u2014 ' + activeFileName);
    }
    renderWorkspaceFilesPanel();
    renderModalFilesList();
    renderAll();
  } catch (e) {
    await showAlert('Could not delete this file.', 'Delete failed');
  }
}

/* ---------------- drag-and-drop reorder (sidebar sections) ---------------- */
function startSectionDrag(e, item) {
  e.preventDefault();
  const nav = document.getElementById('section-nav');
  const items = Array.from(nav.querySelectorAll('.nav-item'));
  const startIndex = items.indexOf(item);
  const itemHeight = item.offsetHeight + 2;
  const startY = e.clientY;
  let currentIndex = startIndex;
  let order = doc.sections.map(s => s.id);

  items.forEach(it => it.classList.add('reordering'));
  item.classList.add('dragging');
  try { item.setPointerCapture(e.pointerId); } catch (err) {}

  function onMove(ev) {
    const deltaY = ev.clientY - startY;
    item.style.transform = 'translateY(' + deltaY + 'px)';
    const shift = Math.round(deltaY / itemHeight);
    const newIndex = Math.max(0, Math.min(order.length - 1, startIndex + shift));
    if (newIndex !== currentIndex) {
      const [movedId] = order.splice(currentIndex, 1);
      order.splice(newIndex, 0, movedId);
      currentIndex = newIndex;
      items.forEach((other, origIdx) => {
        if (other === item) return;
        const newIdx = order.indexOf(other.dataset.id);
        const offset = (newIdx - origIdx) * itemHeight;
        other.style.transform = offset ? 'translateY(' + offset + 'px)' : '';
      });
    }
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    items.forEach(it => { it.classList.remove('dragging', 'reordering'); it.style.transform = ''; });
    doc.sections = order.map(id => doc.sections.find(s => s.id === id));
    markDirty();
    renderAll();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function renderContent() {
  const container = document.getElementById('content-inner');
  container.innerHTML = '';
  if (pendingReconnect) { container.appendChild(buildWelcome()); return; }
  if (!hasConnection) { container.appendChild(buildWelcome()); return; }
  if (doc.sections.length === 0) { container.appendChild(buildEmptySections()); return; }

  if (viewMode === 'all') {
    doc.sections.forEach((sec) => { container.appendChild(sec.type === 'table' ? buildTableCard(sec) : buildWritingCard(sec)); });
    return;
  }

  // Single page mode (page-by-page section navigation)
  let activeIndex = doc.sections.findIndex(s => s.id === activeSectionId);
  if (activeIndex === -1) { activeIndex = 0; activeSectionId = doc.sections[0] ? doc.sections[0].id : null; }
  const sec = doc.sections[activeIndex];
  if (sec) {
    const card = sec.type === 'table' ? buildTableCard(sec) : buildWritingCard(sec);
    container.appendChild(card);

    // Bottom pagination bar
    if (doc.sections.length > 1) {
      const pageNav = document.createElement('div');
      pageNav.className = 'page-nav-bar';

      const prevBtn = document.createElement('button');
      prevBtn.type = 'button';
      prevBtn.className = 'page-nav-btn';
      prevBtn.disabled = activeIndex <= 0;
      const prevSec = activeIndex > 0 ? doc.sections[activeIndex - 1] : null;
      prevBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="15 18 9 12 15 6"/></svg><span>' + (prevSec ? escapeHtml(prevSec.title) : 'Previous') + '</span>';
      prevBtn.onclick = () => {
        if (activeIndex > 0) {
          activeSectionId = doc.sections[activeIndex - 1].id;
          saveToLocalStorage();
          renderSidebar();
          renderContent();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const indicator = document.createElement('div');
      indicator.className = 'page-nav-indicator';
      indicator.textContent = 'Section ' + (activeIndex + 1) + ' of ' + doc.sections.length;

      const nextBtn = document.createElement('button');
      nextBtn.type = 'button';
      nextBtn.className = 'page-nav-btn';
      nextBtn.disabled = activeIndex >= doc.sections.length - 1;
      const nextSec = activeIndex < doc.sections.length - 1 ? doc.sections[activeIndex + 1] : null;
      nextBtn.innerHTML = '<span>' + (nextSec ? escapeHtml(nextSec.title) : 'Next') + '</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="9 18 15 12 9 6"/></svg>';
      nextBtn.onclick = () => {
        if (activeIndex < doc.sections.length - 1) {
          activeSectionId = doc.sections[activeIndex + 1].id;
          saveToLocalStorage();
          renderSidebar();
          renderContent();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      pageNav.appendChild(prevBtn);
      pageNav.appendChild(indicator);
      pageNav.appendChild(nextBtn);
      container.appendChild(pageNav);
    }
  }
}

function buildSectionHead(sec) {
  const head = document.createElement('div');
  head.className = 'section-head';

  const titleInput = document.createElement('input');
  titleInput.type = 'text'; titleInput.className = 'section-title-input'; titleInput.value = sec.title;
  titleInput.spellcheck = false; titleInput.setAttribute('autocomplete', 'off');
  titleInput.readOnly = true;

  // Type icon button (pencil for writing, table for table).
  // Clicking pencil opens editing options (color, edit title, word count).
  const typeIconEl = buildTypeIcon(sec.type, sec.color, (e) => {
    e.stopPropagation();
    openSectionOptionsPopover(typeIconEl, sec, titleInput);
  });

  const actions = document.createElement('div');
  actions.className = 'section-actions';
  const delBtn = document.createElement('button');
  delBtn.type = 'button'; delBtn.title = 'Delete section'; delBtn.className = 'danger';
  delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
  delBtn.onclick = () => deleteSection(sec.id);
  if (!isEditMode) delBtn.style.display = 'none';
  actions.appendChild(delBtn);

  // Keep ONLY pencil visible in section head
  head.appendChild(typeIconEl);
  head.appendChild(titleInput);
  head.appendChild(actions);
  return head;
}

function openSectionOptionsPopover(anchorEl, sec, titleInput) {
  if (guardLocked()) return;
  const pop = document.getElementById('section-options-popover');
  if (!pop) return;

  const customColorInput = document.getElementById('sec-opt-custom-color');
  const isCustomColor = !DEFAULT_PALETTE.some(c => c.toLowerCase() === String(sec.color).toLowerCase());
  if (customColorInput) {
    customColorInput.value = /^#[0-9a-fA-F]{6}$/.test(sec.color) ? sec.color : '#7A2E38';
    customColorInput.style.boxShadow = isCustomColor ? '0 0 0 2px var(--ink)' : '0 0 0 1.5px var(--stone)';
    customColorInput.oninput = () => {
      const color = customColorInput.value;
      sec.color = color;
      const card = document.getElementById('card-' + sec.id);
      if (card) card.style.borderTopColor = color;
      anchorEl.style.color = color;
      markDirty();
      renderSidebar();
      Array.from(swatches.children).forEach(s => s.classList.remove('selected'));
      customColorInput.style.boxShadow = '0 0 0 2px var(--ink)';
    };
  }

  const swatches = document.getElementById('sec-opt-swatches');
  swatches.innerHTML = '';
  DEFAULT_PALETTE.forEach(color => {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'swatch' + (color.toLowerCase() === String(sec.color).toLowerCase() ? ' selected' : '');
    sw.style.background = color;
    sw.title = color;
    sw.onclick = () => {
      sec.color = color;
      if (customColorInput) {
        customColorInput.value = color;
        customColorInput.style.boxShadow = '0 0 0 1.5px var(--stone)';
      }
      const card = document.getElementById('card-' + sec.id);
      if (card) card.style.borderTopColor = color;
      anchorEl.style.color = color;
      markDirty();
      renderSidebar();
      Array.from(swatches.children).forEach(s => s.classList.toggle('selected', s.style.background === color));
    };
    swatches.appendChild(sw);
  });

  const renameBtn = document.getElementById('sec-opt-rename');
  renameBtn.onclick = () => {
    closeSectionOptionsPopover();
    if (isFileLocked) {
      showAlert('This file is locked. Unlock it in Settings to make changes.', 'File locked');
      return;
    }
    setTimeout(() => {
      const card = document.getElementById('card-' + sec.id);
      const input = card ? card.querySelector('.section-title-input') : titleInput;
      startInlineRename(input, (v) => { sec.title = v; markDirty(); renderSidebar(); });
    }, 60);
  };

  const wcRow = document.getElementById('sec-opt-wordcount-row');
  const wcToggle = document.getElementById('sec-opt-wordcount-toggle');
  if (sec.type === 'writing') {
    wcRow.style.display = 'flex';
    wcToggle.checked = sec.showWordCount !== false;
    wcToggle.onchange = () => {
      sec.showWordCount = wcToggle.checked;
      markDirty();
      const card = document.getElementById('card-' + sec.id);
      if (card) {
        const tb = card.querySelector('.writing-toolbar');
        if (tb) tb.style.display = sec.showWordCount !== false ? 'flex' : 'none';
      }
    };
  } else {
    wcRow.style.display = 'none';
  }

  const rect = anchorEl.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 250)) + 'px';
  pop.style.top = (rect.bottom + 8) + 'px';
  pop.classList.add('open');
  setTimeout(() => document.addEventListener('mousedown', outsideSecOptionsClick), 0);
}

function closeSectionOptionsPopover() {
  const pop = document.getElementById('section-options-popover');
  if (pop) pop.classList.remove('open');
  document.removeEventListener('mousedown', outsideSecOptionsClick);
}

function outsideSecOptionsClick(e) {
  const pop = document.getElementById('section-options-popover');
  if (pop && !pop.contains(e.target)) closeSectionOptionsPopover();
}

/* =====================================================================
   RICH TEXT: bullets, numbers, highlights
   Stored as plain text in the .md file:
     "- text"            small bullet
     "* text"            title bullet (colour = section/column colour)
     "*{#C94B60} text"   title bullet with its own colour
     "1. text"           numbered item
     "==text=="          highlight with the default look
     "=={#FFD84D,40,u}text=="   colour, opacity %, style (m marker, u underline, b box)
   Read mode draws them; Edit mode keeps the raw text so typing stays simple.
===================================================================== */
const HL_STYLES = ['m', 'u', 'b'];
const HL_PALETTE = ['#FFD84D', '#FF9F6B', '#6EE7A8', '#5CC8FF', '#C792EA', '#FF7EB6'];
const HEX_RE = /^#[0-9a-fA-F]{3,8}$/;
const LINE_RE = /^(?:(- )|\*(?:\{(#[0-9a-fA-F]{3,8})\})? |(\d+)\. )/;

function hlDefaults() {
  const s = Object.assign(defaultSettings(), (typeof doc !== 'undefined' && doc && doc.settings) || {});
  let op = parseInt(s.hlOpacity, 10);
  if (!(op >= 5 && op <= 100)) op = 40;
  return { color: HEX_RE.test(s.hlColor) ? s.hlColor : '#FFD84D', opacity: op, style: HL_STYLES.includes(s.hlStyle) ? s.hlStyle : 'm' };
}
function hlResolve(attrs) {
  const d = hlDefaults(), a = attrs || {};
  return { color: a.color || d.color, opacity: a.opacity != null ? a.opacity : d.opacity, style: a.style || d.style };
}
function parseHlAttrs(str) {
  const a = { color: null, opacity: null, style: null };
  if (str == null) return a;
  String(str).split(',').forEach(t => {
    t = t.trim();
    if (HEX_RE.test(t)) a.color = t;
    else if (/^\d{1,3}$/.test(t)) a.opacity = Math.min(100, Math.max(5, parseInt(t, 10)));
    else if (/^[mub]$/.test(t)) a.style = t;
  });
  return a;
}
function fmtHlAttrs(a) {
  if (!a) return '';
  const parts = [a.color || '', a.opacity != null ? String(a.opacity) : '', a.style || ''];
  while (parts.length && parts[parts.length - 1] === '') parts.pop();
  return parts.length ? '{' + parts.join(',') + '}' : '';
}

function parseLine(line) {
  const m = LINE_RE.exec(line);
  if (!m) return { kind: null, plen: 0 };
  if (m[1]) return { kind: 'small', plen: 2 };
  if (m[3] !== undefined) return { kind: 'num', plen: m[0].length, num: parseInt(m[3], 10) };
  return { kind: 'title', plen: m[0].length, color: m[2] || null };
}

function findHighlights(line) {
  const masked = line.replace(/\\==/g, '\u0000\u0000\u0000');
  const re = /==(?:\{([^{}\n]*)\})?(?=[^\s=])([^\n]*?[^\s=])==/g;
  const out = [];
  let m;
  while ((m = re.exec(masked))) {
    const s = m.index, e = s + m[0].length;
    const head = 2 + (m[1] !== undefined ? m[1].length + 2 : 0);
    out.push({ s, e, os: s + head, oe: e - 2, attrs: parseHlAttrs(m[1]) });
  }
  return out;
}
function allHighlights(text) {
  const out = [];
  let off = 0;
  String(text || '').split('\n').forEach((line, li) => {
    findHighlights(line).forEach(h => out.push({ li, ls: off, S: off + h.s, E: off + h.e, OS: off + h.os, OE: off + h.oe, attrs: h.attrs, idx: out.length }));
    off += line.length + 1;
  });
  return out;
}

function lineBounds(text, pos) {
  const s = pos <= 0 ? 0 : text.lastIndexOf('\n', pos - 1) + 1;
  let e = text.indexOf('\n', pos);
  if (e < 0) e = text.length;
  return [s, e];
}
function selLines(text, a, b) {
  const s = lineBounds(text, a)[0];
  const endPos = (b > a && text[b - 1] === '\n') ? b - 1 : b;
  return [s, lineBounds(text, endPos)[1]];
}

/* renumber the numbered blocks touching [lo,hi]; returns the new text and a position mapper */
function renumberTouching(text, lo, hi) {
  const lines = text.split('\n');
  const starts = [];
  let off = 0;
  lines.forEach(l => { starts.push(off); off += l.length + 1; });
  const lineOf = (pos) => { let i = 0; while (i + 1 < lines.length && starts[i + 1] <= pos) i++; return i; };
  const l0 = Math.max(0, lineOf(lo) - 1), l1 = Math.min(lines.length - 1, lineOf(hi) + 1);
  const nl = lines.slice();
  for (let i = l0; i <= l1; i++) {
    if (parseLine(nl[i]).kind !== 'num') continue;
    let bs = i; while (bs > 0 && parseLine(nl[bs - 1]).kind === 'num') bs--;
    let be = i; while (be + 1 < nl.length && parseLine(nl[be + 1]).kind === 'num') be++;
    let n = 1;
    for (let k = bs; k <= be; k++) { const p = parseLine(nl[k]); nl[k] = (n++) + '. ' + nl[k].slice(p.plen); }
    i = be;
  }
  const nstarts = [];
  off = 0;
  nl.forEach(l => { nstarts.push(off); off += l.length + 1; });
  const map = (pos) => { const li = lineOf(pos); const fromEnd = starts[li] + lines[li].length - pos; return nstarts[li] + nl[li].length - fromEnd; };
  return { text: nl.join('\n'), map };
}

/* "a, b, c" selected on ONE line -> "1) a 2) b 3) c" (separators are replaced by the numbers, the text
   stays a natural paragraph). On numbered text: out of order or with leftover commas -> renumber and clean,
   already clean and in order -> numbers removed and commas put back. */
function inlineNumber(text, a, b) {
  const sel = text.slice(a, b);
  if (sel.indexOf('\n') !== -1) return null;
  const core = sel.trim();
  if (!core) return null;
  const lead = /^\s*/.exec(sel)[0], trail = sel.slice(lead.length + core.length);
  const SEP = /[,\u060C;\u061B]/;
  const toks = [];
  const re = /(^|\s)(\d{1,3})\)\s+/g;
  let m;
  while ((m = re.exec(core))) toks.push({ pos: m.index + m[1].length, end: m.index + m[0].length, n: parseInt(m[2], 10) });
  let out;
  if (toks.length >= 2 && toks[0].pos === 0) {
    const raw = toks.map((tk, i) => core.slice(tk.end, i + 1 < toks.length ? toks[i + 1].pos : core.length));
    const items = raw.map(x => x.replace(/[\s,\u060C;\u061B]+$/, '')).filter(x => x !== '');
    if (items.length < 2) return null;
    const leftover = raw.some(x => /[,\u060C;\u061B]\s*$/.test(x));
    const sequential = toks.every((tk, i) => tk.n === i + 1);
    out = (sequential && !leftover) ? items.join(', ') : items.map((it, i) => (i + 1) + ') ' + it).join(' ');
  } else {
    if (!SEP.test(core)) return null;
    const items = core.split(/[,\u060C;\u061B]/).map(x => x.trim()).filter(Boolean);
    if (items.length < 2) return null;
    out = items.map((it, i) => (i + 1) + ') ' + it).join(' ');
  }
  out = lead + out + trail;
  return { text: text.slice(0, a) + out + text.slice(b), a, b: a + out.length };
}

function toggleList(text, a, b, kind) {
  if (kind === 'num' && b > a) { const r = inlineNumber(text, a, b); if (r) return r; }
  const [s, e] = selLines(text, a, b);
  const lines = text.slice(s, e).split('\n');
  let idxs = [];
  lines.forEach((l, i) => { if (l.trim() !== '') idxs.push(i); });
  if (!idxs.length) idxs = [0];
  const want = (l) => parseLine(l).kind === kind;
  const allHave = idxs.every(i => want(lines[i]));
  if (kind === 'num' && allHave) {
    const fix = renumberTouching(text, a, b);
    if (fix.text !== text) return { text: fix.text, a: fix.map(a), b: fix.map(b) };
  }
  let n = 1;
  if (s > 0) { const prev = parseLine(text.slice(text.lastIndexOf('\n', s - 2) + 1, s - 1)); if (prev.kind === 'num') n = prev.num + 1; }
  const caretLine = (a === b) ? text.slice(s, a).split('\n').length - 1 : -1;
  const nl = lines.map((l, i) => {
    if (!idxs.includes(i)) return l;
    const p = parseLine(l), rest = l.slice(p.plen);
    if (allHave) return rest;
    if (kind === 'num') return (n++) + '. ' + rest;
    if (kind === 'small') return '- ' + rest;
    return p.kind === 'title' ? l : '* ' + rest;
  });
  const block = nl.join('\n');
  let t = text.slice(0, s) + block + text.slice(e);
  let na, nb;
  if (a === b) {
    const ci = Math.max(0, Math.min(lines.length - 1, caretLine));
    na = nb = Math.max(s + nl.slice(0, ci).join('\n').length + (ci ? 1 : 0), a + (nl[ci].length - lines[ci].length));
  } else { na = s; nb = s + block.length; }
  const r = renumberTouching(t, s, s + block.length);
  return { text: r.text, a: r.map(na), b: r.map(nb) };
}

function continueList(text, pos) {
  const [ls, le] = lineBounds(text, pos);
  const line = text.slice(ls, le), p = parseLine(line);
  if (p.kind !== 'num' && p.kind !== 'small') return null;
  if (pos - ls < p.plen) return null;
  if (line.slice(p.plen).trim() === '') return { text: text.slice(0, ls) + text.slice(le), a: ls, b: ls };
  const next = p.kind === 'num' ? (p.num + 1) + '. ' : '- ';
  const t = text.slice(0, pos) + '\n' + next + text.slice(pos);
  const caret = pos + 1 + next.length;
  const r = renumberTouching(t, caret, caret);
  return { text: r.text, a: r.map(caret), b: r.map(caret) };
}

function removePrefixAtCaret(text, pos) {
  const [ls, le] = lineBounds(text, pos);
  const p = parseLine(text.slice(ls, le));
  if (!p.kind || pos !== ls + p.plen) return null;
  const t = text.slice(0, ls) + text.slice(ls + p.plen);
  const r = renumberTouching(t, ls, ls);
  return { text: r.text, a: r.map(ls), b: r.map(ls) };
}

function setBulletColor(text, li, color) {
  const lines = text.split('\n');
  const p = parseLine(lines[li] || '');
  if (p.kind !== 'title') return text;
  lines[li] = '*' + (color ? '{' + color + '}' : '') + ' ' + lines[li].slice(p.plen);
  return lines.join('\n');
}

/* The editor shows "* text"; the colour lives in a hidden per-line list (ta._bc) and is merged back
   into "*{#hex} text" only when the content is stored. The file format itself does not change. */
function splitContent(stored) {
  const bc = [];
  const disp = String(stored == null ? '' : stored).split('\n').map((l, i) => {
    const p = parseLine(l);
    if (p.kind === 'title' && p.color) { bc[i] = p.color; return '* ' + l.slice(p.plen); }
    bc[i] = null;
    return l;
  });

}
function composeContent(display, bc) {
  return String(display).split('\n').map((l, i) => {
    const c = bc && bc[i];
    return (c && /^\* /.test(l)) ? '*{' + c + '} ' + l.slice(2) : l;
  }).join('\n');
}
function reconcileMeta(oldV, newV, bc) {
  const o = String(oldV).split('\n'), n = String(newV).split('\n');
  let p = 0;
  while (p < o.length && p < n.length && o[p] === n[p]) p++;
  let s = 0;
  while (s < o.length - p && s < n.length - p && o[o.length - 1 - s] === n[n.length - 1 - s]) s++;
  const out = [];
  for (let i = 0; i < p; i++) out.push(bc[i] || null);
  const mo = o.length - p - s, mn = n.length - p - s;
  for (let i = 0; i < mn; i++) out.push(i < mo ? (bc[p + i] || null) : null);
  for (let i = 0; i < s; i++) out.push(bc[o.length - s + i] || null);

}
function syncMeta(ta) {

  ta._dispVal = ta.value;
}

function stripFormat(text) {
  return String(text || '').split('\n').map(l => {
    const p = parseLine(l);
    return l.slice(p.plen).replace(/(^|[\s,\u060C;\u061B])\d{1,3}\)(?=\s)/g, '$1').replace(/\\==/g, '\u0001').replace(/==(?:\{[^{}\n]*\})?/g, '').replace(/\u0001/g, '==');
  }).join('\n');

/* ---- highlight operations (pure: text in, text out) ---- */
function innerOf(text, h) { return text.slice(h.OS, h.OE); }

function removeHighlight(text, idx) {
  const h = allHighlights(text)[idx];
  if (!h) return null;
  const inner = innerOf(text, h);
  return { text: text.slice(0, h.S) + inner + text.slice(h.E), a: h.S, b: h.S + inner.length };
}

function setHighlightAttrs(text, idx, attrs) {
  const h = allHighlights(text)[idx];
  if (!h) return text;
  return text.slice(0, h.S) + '==' + fmtHlAttrs(attrs) + text.slice(h.OS);

function wordAt(text, pos, ls, le) {
  const isW = (c) => /[\p{L}\p{N}'\u2019\-]/u.test(c);
  let s = pos, e = pos;

}

function applyHighlight(text, a, b) {
  const hs = allHighlights(text);
  if (a === b) {
    const inside = hs.find(h => a >= h.S && a <= h.E);
    if (inside) { const r = removeHighlight(text, inside.idx); return { text: r.text, a: r.a, b: r.b, removed: true }; }
    const [ls, le] = lineBounds(text, a);
    const p = parseLine(text.slice(ls, le));
    const w = wordAt(text, a, ls + p.plen, le);
    if (!w) return null;
    a = w[0]; b = w[1];
  } else {
    const one = hs.find(h => a >= h.OS && b <= h.OE);
    if (one) { const r = removeHighlight(text, one.idx); return { text: r.text, a: r.a, b: r.b, removed: true }; }
  }
  const [fs, fe] = selLines(text, a, b);
  const jobs = [];
  let off = fs;
  text.slice(fs, fe).split('\n').forEach(line => {
    const ls = off, le = off + line.length;
    off = le + 1;
    const p = parseLine(line);
    let s = Math.max(a, ls + p.plen), e = Math.min(b, le);
    while (s < e && /\s/.test(text[s])) s++;
    while (e > s && /\s/.test(text[e - 1])) e--;
    if (s >= e) return;
    const lineH = hs.filter(h => h.S >= ls && h.E <= le);
    let first = null, changed = true;
    while (changed) {
      changed = false;
      lineH.forEach(h => { if (h.S < e && h.E > s && (h.S < s || h.E > e)) { s = Math.min(s, h.S); e = Math.max(e, h.E); changed = true; } });
    }
    const over = lineH.filter(h => h.S >= s && h.E <= e);
    first = over[0] ? over[0].attrs : null;
    let plain = '', pos = s;
    over.forEach(h => { plain += text.slice(pos, h.S) + text.slice(h.OS, h.OE); pos = h.E; });
    plain += text.slice(pos, e);

  });

  let t = text;
  for (let i = jobs.length - 1; i >= 0; i--) t = t.slice(0, jobs[i].s) + jobs[i].repl + t.slice(jobs[i].e);
  const all = allHighlights(t);
  let shift = 0;
  const starts = jobs.map(j => { const st = j.s + shift; shift += j.repl.length - (j.e - j.s); return st; });
  const h1 = all.find(h => h.S === starts[0]);
  const hl = all.find(h => h.S === starts[starts.length - 1]);
  return { text: t, a: h1 ? h1.OS : starts[0], b: hl ? hl.OE : starts[0], idx: h1 ? h1.idx : 0, removed: false };
}

/* edge: 'end' | 'start'; dir: +1 grow, -1 shrink (end) / grow backwards (start uses -1 to grow) */
function resizeHighlight(text, idx, edge, dir) {
  const h = allHighlights(text)[idx];
  if (!h) return null;
  const [ls, le] = lineBounds(text, h.S);
  const lim = ls + parseLine(text.slice(ls, le)).plen;
  const attrs = text.slice(h.S + 2, h.OS);
  let t, newS = h.S;
  if (edge === 'end' && dir > 0) {
    let p = h.E; while (p < le && /\s/.test(text[p])) p++;
    if (p >= le) return null;
    let q = p; while (q < le && !/\s/.test(text[q])) q++;
    if (text.slice(h.E, q).includes('==')) return null;
    t = text.slice(0, h.OE) + text.slice(h.E, q) + '==' + text.slice(q);
  } else if (edge === 'end') {
    const inner = text.slice(h.OS, h.OE).replace(/\s+$/, '');
    const k = inner.search(/\S+$/);
    if (k <= 0) return null;
    const keep = inner.slice(0, k).replace(/\s+$/, '');
    const ne = h.OS + keep.length;
    t = text.slice(0, ne) + '==' + text.slice(ne, h.OE) + text.slice(h.E);
  } else if (dir < 0) {
    let p = h.S; while (p > lim && /\s/.test(text[p - 1])) p--;
    if (p <= lim) return null;
    let q = p; while (q > lim && !/\s/.test(text[q - 1])) q--;
    if (text.slice(q, h.S).includes('==')) return null;
    t = text.slice(0, q) + '==' + attrs + text.slice(q, h.S) + text.slice(h.OS);
    newS = q;
  } else {
    const inner = text.slice(h.OS, h.OE);
    const m = /^\S+\s+/.exec(inner);
    if (!m || m[0].length >= inner.length) return null;
    const ns = h.OS + m[0].length;
    t = text.slice(0, h.S) + text.slice(h.OS, ns) + '==' + attrs + text.slice(ns);
    newS = h.S + m[0].length;
  }
  const nh = allHighlights(t).find(x => x.S === newS);
  if (!nh) return null;
  return { text: t, a: nh.OS, b: nh.OE, idx: nh.idx };
}

/* ---------------- Read-mode rendering ---------------- */
function richPlain(s) { return escapeHtml(s).replace(/\\==/g, '=='); }
function safeColor(c, fb) { return HEX_RE.test(c || '') ? c : fb; }

function numTag(label, d) {
  return '<span class="numtag hl hl-' + d.style + '" style="--hlc:' + safeColor(d.color, '#FFD84D') + ';--hlo:' + d.opacity + '">' + label + '</span>';
}
function richInline(html, d) {
  return html.replace(/(^|[\s,\u060C;\u061B])(\d{1,3}\))(?=\s)/g, (m0, pre, num) => pre + numTag(num, d));
}
function renderRich(text, ctx) {
  ctx = ctx || {};
  const base = safeColor(ctx.color, '#888888');
  const clickable = !isFileLocked;
  const dflt = { color: base, opacity: 32, style: 'm' };   // numbers: the section's own colour, softer than a highlight
  const out = [];
  let hi = 0, prevBlank = true, off = 0;
  String(text || '').split('\n').forEach((line, li) => {
    const ls = off;
    off += line.length + 1;
    if (line.trim() === '') { if (!prevBlank) out.push('<div class="rl-gap"></div>'); prevBlank = true; return; }
    prevBlank = false;
    const p = parseLine(line), rest = line.slice(p.plen);
    const seg = (a, b) => b > a ? '<span class="rt" data-s="' + a + '" data-n="' + (b - a) + '">' + richInline(richPlain(rest.slice(a, b)), dflt) + '</span>' : '';
    let inner = '', pos = 0;
    findHighlights(rest).forEach(h => {
      const r = hlResolve(h.attrs);
      inner += seg(pos, h.s);
      inner += '<mark class="hl hl-' + r.style + '" data-i="' + (hi++) + '" data-s="' + h.os + '" data-n="' + (h.oe - h.os) + '" style="--hlc:' + safeColor(r.color, '#FFD84D') + ';--hlo:' + r.opacity + '">' + richPlain(rest.slice(h.os, h.oe)) + '</mark>';
      pos = h.e;
    });
    inner += seg(pos, rest.length);
    let mk = '';
    if (p.kind === 'title') mk = '<span class="rl-mk"><span class="rl-dot rl-title-dot"' + (clickable ? ' data-click="1" title="Change color"' : '') + ' data-li="' + li + '" style="background:' + safeColor(p.color, base) + '"></span></span>';
    else if (p.kind === 'small') mk = '<span class="rl-mk"><span class="rl-dot rl-small-dot"></span></span>';
    else if (p.kind === 'num') mk = '<span class="rl-mk rl-num">' + numTag(p.num + '.', dflt) + '</span>';
    out.push('<div class="rl rl-k-' + (p.kind || 'text') + '" data-ls="' + (ls + p.plen) + '">' + mk + '<div class="rl-body">' + inner + '</div></div>');
  });
  return '<div class="rich" style="--rc:' + base + '" data-tgt="' + escapeHtml(ctx.tgt || '') + '">' + out.join('') + '</div>';
}

/* Alt+H in Read mode: map the selection on the drawn text back to the stored text */
function rendToRaw(raw, k) {
  let r = 0, c = 0;
  while (r < raw.length) {
    if (raw[r] === '\\' && raw.startsWith('==', r + 1)) { r++; continue; }
    if (c === k) break;
    r++; c++;
  }
  return r;
}
function selectionToRaw(box, range, text) {
  let lo = Infinity, hi = -1;
  box.querySelectorAll('.rl').forEach(row => {
    const base = parseInt(row.getAttribute('data-ls'), 10);
    row.querySelectorAll('.rt, mark.hl').forEach(el => {
      const s0 = parseInt(el.getAttribute('data-s'), 10), n0 = parseInt(el.getAttribute('data-n'), 10);
      const raw = text.slice(base + s0, base + s0 + n0);
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let prior = 0, tn;
      while ((tn = walker.nextNode())) {
        const len = tn.nodeValue.length;
        if (range.intersectsNode(tn)) {
          const a = tn === range.startContainer ? range.startOffset : 0;
          const b = tn === range.endContainer ? range.endOffset : len;
          if (b > a) {
            lo = Math.min(lo, base + s0 + rendToRaw(raw, prior + a));
            hi = Math.max(hi, base + s0 + rendToRaw(raw, prior + b));
          }
        }
        prior += len;
      }
    });
  });
  return hi < 0 ? null : [lo, hi];
}
function onReadKeydown(e) {
  if (isEditMode || isFileLocked) return;
  if (!(e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.code === shortcuts.hl)) return;
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const startEl = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
  const box = startEl && startEl.closest ? startEl.closest('.rich') : null;
  const tgt = box && resolveTgt(box.getAttribute('data-tgt'));
  if (!tgt) return;
  e.preventDefault(); e.stopPropagation();
  const text = tgt.get();
  const span = selectionToRaw(box, range, text);
  if (!span) return;
  const r = applyHighlight(text, span[0], span[1]);
  if (!r) return;
  tgt.set(r.text);
  markDirty();
  const y = window.scrollY;
  sel.removeAllRanges();
  renderContent();
  window.scrollTo(0, y);
}

function resolveTgt(str) {
  const p = String(str || '').split(':');
  const sec = doc.sections.find(s => s.id === p[1]);
  if (!sec) return null;
  if (p[0] === 'w') return { get: () => sec.content || '', set: (v) => { sec.content = v; } };
  const row = (sec.rows || []).find(r => r.id === p[2]);
  if (!row) return null;
  return { get: () => row.cells[p[3]] || '', set: (v) => { row.cells[p[3]] = v; } };
}
function richContainer(tgt) {
  return Array.from(document.querySelectorAll('.rich')).find(el => el.getAttribute('data-tgt') === tgt) || null;
}
function patchMark(mk, attrs) {
  const r = hlResolve(attrs);
  mk.className = 'hl hl-' + r.style;
  mk.style.setProperty('--hlc', safeColor(r.color, '#FFD84D'));
  mk.style.setProperty('--hlo', String(r.opacity));
}

/* ---------------- Edit-mode glue ---------------- */
let fmtBusy = false;
let hlActive = null;      // { ta, idx } while a highlight is being resized with Ctrl+arrows

function applyTextChange(ta, newText, a, b) {
  const old = ta.value;
  fmtBusy = true;
  try {
    if (old !== newText) {
      let i = 0;
      const min = Math.min(old.length, newText.length);
      while (i < min && old[i] === newText[i]) i++;
      let j = 0;
      while (j < min - i && old[old.length - 1 - j] === newText[newText.length - 1 - j]) j++;
      const ins = newText.slice(i, newText.length - j);
      let ok = false;
      try {
        ta.focus();
        ta.setSelectionRange(i, old.length - j);
        ok = ins === '' ? document.execCommand('delete') : document.execCommand('insertText', false, ins);
      } catch (e) { ok = false; }
      if (!ok || ta.value !== newText) {
        ta.value = newText;
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
    if (a != null) ta.setSelectionRange(a, b == null ? a : b);
    ta._prevVal = ta.value;
  } finally { fmtBusy = false; }
}

function isFmtTextarea(el) {
  return !!el && el.tagName === 'TEXTAREA' && (el.classList.contains('writing-area') || el.classList.contains('cell-input'));
}
function caretClientPos(ta) {
  const r = ta.getBoundingClientRect();
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 26;
  const li = ta.value.slice(0, ta.selectionStart).split('\n').length;
  return { x: r.left + 24, y: Math.min(r.bottom, Math.max(r.top + 12, r.top + 6 + li * lh)) };
}

function runFmtAction(ta, action) {
  const text = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
  if (action === 'title' || action === 'small' || action === 'num') {
    const r = toggleList(text, a, b, action);
    applyTextChange(ta, r.text, r.a, r.b);
    return;
  }
  if (action === 'hl') {
    const r = applyHighlight(text, a, b);
    if (!r) return;
    applyTextChange(ta, r.text, r.a, r.b);
    hlActive = r.removed ? null : { ta, idx: r.idx };
    return;
  }
  if (action === 'color') {
    const pos = caretClientPos(ta);
    const h = allHighlights(text).find(x => a <= x.E && b >= x.S);
    if (h) { openHlPanelForTextarea(ta, h.idx, pos.x, pos.y); return; }
    const [ls, le] = lineBounds(text, a);
    const p = parseLine(text.slice(ls, le));
    if (p.kind === 'title') openTitleColorForTextarea(ta, pos.x, pos.y);
  }
}

function openTitleColorForTextarea(ta, x, y) {
  const li = ta.value.slice(0, ta.selectionStart).split('\n').length - 1;
  const card = ta.closest('.section-card');
  const sec = card ? doc.sections.find(s => 'card-' + s.id === card.id) : null;
  const cur = (ta._bc && ta._bc[li]) || (sec ? sec.color : '#7A2E38');
  openColorPopover({ getBoundingClientRect: () => ({ left: x, bottom: y }) }, cur, (color) => {
    ta._bc = (ta._bc || []).slice();
    ta._bc[li] = color;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  });
}

function onFmtKeydown(e) {
  const ta = e.target;
  if (!isFmtTextarea(ta) || !isEditMode || isFileLocked) return;
  const isCell = ta.classList.contains('cell-input');
  const text = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
  const noMods = !e.ctrlKey && !e.altKey && !e.metaKey;

  if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    const action = Object.keys(shortcuts).find(k => shortcuts[k] === e.code);
    if (action) { e.preventDefault(); e.stopPropagation(); runFmtAction(ta, action); return; }
  }

  const arrow = /^Arrow(Left|Right|Up|Down)$/.test(e.key);
  if (hlActive && hlActive.ta === ta && e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey && arrow) {
    e.preventDefault(); e.stopPropagation();
    const edge = (e.key === 'ArrowLeft' || e.key === 'ArrowRight') ? 'end' : 'start';
    const dir = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;
    const r = resizeHighlight(ta.value, hlActive.idx, edge, edge === 'end' ? dir : (e.key === 'ArrowUp' ? -1 : 1));
    if (r) { applyTextChange(ta, r.text, r.a, r.b); hlActive.idx = r.idx; }
    return;
  }
  if (['Control', 'Alt', 'Shift', 'Meta'].indexOf(e.key) === -1) hlActive = null;
  if (e.key === 'Escape') return;

  if (e.key === 'Enter' && noMods && a === b && ((!isCell && !e.shiftKey) || (isCell && e.shiftKey))) {
    const r = continueList(text, a);
    if (r) { e.preventDefault(); e.stopPropagation(); applyTextChange(ta, r.text, r.a, r.b); }
    return;
  }
  if (e.key === 'Backspace' && noMods && !e.shiftKey && a === b) {
    const r = removePrefixAtCaret(text, a);
    if (r) { e.preventDefault(); e.stopPropagation(); applyTextChange(ta, r.text, r.a, r.b); }
  }
}

function onFmtInput(e) {
  const ta = e.target;
  if (!isFmtTextarea(ta)) return;
  const prev = ta._prevVal;
  ta._prevVal = ta.value;
  if (fmtBusy || prev == null) return;
  if (e.inputType && e.inputType.indexOf('delete') === 0 && prev.split('\n').length > ta.value.split('\n').length) {
    const pos = ta.selectionStart;
    const r = renumberTouching(ta.value, pos, pos);
    if (r.text !== ta.value) applyTextChange(ta, r.text, r.map(pos));
  }
}

function openHlPanelForTextarea(ta, idx, x, y) {
  hlActive = { ta, idx };
  openHlPanel({
    x, y,
    getAttrs: () => { const h = allHighlights(ta.value)[idx]; return h ? Object.assign({}, h.attrs) : {}; },
    apply: (attrs) => applyTextChange(ta, setHighlightAttrs(ta.value, idx, attrs)),
    remove: () => { const r = removeHighlight(ta.value, idx); if (r) applyTextChange(ta, r.text, r.a, r.b); hlActive = null; }
  });
}

function onFmtContextMenu(e) {
  const ta = e.target;
  if (!isFmtTextarea(ta) || !isEditMode || isFileLocked) return;
  const a = ta.selectionStart, b = ta.selectionEnd;
  const h = allHighlights(ta.value).find(x => a <= x.E && b >= x.S);
  if (h) { e.preventDefault(); openHlPanelForTextarea(ta, h.idx, e.clientX, e.clientY); return; }
  const [ls, le] = lineBounds(ta.value, a);
  const p = parseLine(ta.value.slice(ls, le));
  if (p.kind === 'title' && a - ls <= p.plen) { e.preventDefault(); openTitleColorForTextarea(ta, e.clientX, e.clientY); }
}

function onFmtClick(e) {
  const ta = e.target;
  if (!isFmtTextarea(ta) || !isEditMode || isFileLocked || !e.ctrlKey) return;
  const pos = ta.selectionStart;
  const h = allHighlights(ta.value).find(x => pos >= x.S && pos <= x.E);
  if (h) { hlActive = { ta, idx: h.idx }; ta.setSelectionRange(h.OS, h.OE); }
}

/* ---------------- Read-mode interactions ---------------- */
function onReadContextMenu(e) {
  if (isEditMode || isFileLocked) return;
  const mk = e.target.closest ? e.target.closest('mark.hl') : null;
  if (!mk) return;
  const box = mk.closest('.rich');
  const tgt = box && resolveTgt(box.getAttribute('data-tgt'));
  if (!tgt) return;
  e.preventDefault();
  const idx = parseInt(mk.getAttribute('data-i'), 10);
  const tname = box.getAttribute('data-tgt');
  const markEl = () => { const c = richContainer(tname); return c && c.querySelector('mark.hl[data-i="' + idx + '"]'); };
  openHlPanel({
    x: e.clientX, y: e.clientY,
    getAttrs: () => { const h = allHighlights(tgt.get())[idx]; return h ? Object.assign({}, h.attrs) : {}; },
    apply: (attrs) => { tgt.set(setHighlightAttrs(tgt.get(), idx, attrs)); const m = markEl(); if (m) patchMark(m, attrs); markDirty(); },
    remove: () => { const r = removeHighlight(tgt.get(), idx); if (r) { tgt.set(r.text); markDirty(); renderContent(); } }
  });
}
function onReadClick(e) {
  if (isEditMode || isFileLocked) return;
  const dot = e.target.closest ? e.target.closest('.rl-title-dot[data-click]') : null;
  if (!dot) return;
  const box = dot.closest('.rich');
  const tgt = box && resolveTgt(box.getAttribute('data-tgt'));
  if (!tgt) return;
  const li = parseInt(dot.getAttribute('data-li'), 10);
  const cur = parseLine(tgt.get().split('\n')[li] || '').color || dot.style.background;
  openColorPopover(dot, HEX_RE.test(cur) ? cur : '#7A2E38', (color) => {
    tgt.set(setBulletColor(tgt.get(), li, color));
    dot.style.background = color;
    markDirty();
  });
}

/* ---------------- Highlight settings panel ---------------- */
let hlPanelCtx = null;
function ensureHlPanel() {
  let el = document.getElementById('hl-panel');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'hl-panel';
  el.className = 'popover hl-panel';
  el.innerHTML =
    '<div class="hlp-title">Highlight</div>' +
    '<div class="hlp-label">Color</div><div class="hlp-swatches" id="hlp-swatches"></div>' +
    '<div class="custom-color-row"><input type="color" id="hlp-custom" value="#FFD84D"><label for="hlp-custom">Custom color</label></div>' +
    '<div class="hlp-label">Opacity <span id="hlp-opv"></span></div><input type="range" id="hlp-op" min="10" max="90" step="5">' +
    '<div class="hlp-label">Style</div><div class="hlp-styles" id="hlp-styles">' +
    '<button type="button" data-s="m">Marker</button><button type="button" data-s="u">Underline</button><button type="button" data-s="b">Box</button></div>' +
    '<div class="hlp-actions"><button type="button" class="btn ghost small" id="hlp-default">Make default</button>' +
    '<button type="button" class="btn ghost small" id="hlp-reset">Use default</button>' +
    '<button type="button" class="btn ghost small" id="hlp-remove">Remove</button></div>' +
    '<div class="hlp-hint">Changes affect this highlight only. Make default changes every highlight that uses the default look.</div>';
  document.body.appendChild(el);
  return el;
}
function closeHlPanel() {
  const el = document.getElementById('hl-panel');
  if (el) el.classList.remove('open');
  hlPanelCtx = null;
  document.removeEventListener('mousedown', outsideHlPanel, true);
  document.removeEventListener('keydown', escHlPanel, true);
}
function outsideHlPanel(e) { const el = document.getElementById('hl-panel'); if (el && !el.contains(e.target)) closeHlPanel(); }
function escHlPanel(e) { if (e.key === 'Escape') { e.stopPropagation(); closeHlPanel(); } }

function openHlPanel(ctx) {
  const el = ensureHlPanel();
  hlPanelCtx = ctx;
  let attrs = ctx.getAttrs();
  const q = (id) => document.getElementById(id);
  function refresh() {
    const r = hlResolve(attrs);
    const sw = q('hlp-swatches');
    sw.innerHTML = '';
    HL_PALETTE.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'swatch' + (c.toLowerCase() === r.color.toLowerCase() ? ' selected' : '');
      b.style.background = c;
      b.onclick = () => change({ color: c });
      sw.appendChild(b);
    });
    q('hlp-custom').value = /^#[0-9a-fA-F]{6}$/.test(r.color) ? r.color : '#FFD84D';
    q('hlp-op').value = String(r.opacity);
    q('hlp-opv').textContent = r.opacity + '%';
    q('hlp-styles').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.getAttribute('data-s') === r.style));
  }
  function change(part) {
    attrs = Object.assign({ color: null, opacity: null, style: null }, attrs, part);
    ctx.apply(attrs);
    refresh();
  }
  q('hlp-custom').oninput = (e) => change({ color: e.target.value });
  q('hlp-op').oninput = (e) => change({ opacity: parseInt(e.target.value, 10) });
  q('hlp-styles').querySelectorAll('button').forEach(b => { b.onclick = () => change({ style: b.getAttribute('data-s') }); });
  q('hlp-reset').onclick = () => { attrs = { color: null, opacity: null, style: null }; ctx.apply(attrs); refresh(); };
  q('hlp-remove').onclick = () => { const c = ctx; closeHlPanel(); c.remove(); };
  q('hlp-default').onclick = () => {
    const r = hlResolve(attrs);
    doc.settings = Object.assign(defaultSettings(), doc.settings || {}, { hlColor: r.color, hlOpacity: String(r.opacity), hlStyle: r.style });
    attrs = { color: null, opacity: null, style: null };
    ctx.apply(attrs);
    markDirty();
    if (!isEditMode) renderContent();
    refresh();
  };
  refresh();
  el.classList.add('open');
  const w = el.offsetWidth || 250, h = el.offsetHeight || 300;
  el.style.left = Math.max(8, Math.min(ctx.x, window.innerWidth - w - 8)) + 'px';
  el.style.top = Math.max(8, Math.min(ctx.y + 8, window.innerHeight - h - 8)) + 'px';
  setTimeout(() => {
    document.addEventListener('mousedown', outsideHlPanel, true);
    document.addEventListener('keydown', escHlPanel, true);
  }, 0);
}

/* ---------------- Shortcuts ---------------- */
const SHORTCUT_DEFAULTS = { title: 'KeyB', small: 'KeyL', num: 'KeyN', hl: 'KeyH', color: 'KeyC' };
const SHORTCUT_LABELS = { title: 'Title bullet', small: 'Small bullet', num: 'Numbers', hl: 'Highlight', color: 'Color settings at cursor' };
let shortcuts = Object.assign({}, SHORTCUT_DEFAULTS);
try { Object.assign(shortcuts, JSON.parse(localStorage.getItem('notebook_shortcuts') || '{}')); } catch (e) {}
function saveShortcuts() { try { localStorage.setItem('notebook_shortcuts', JSON.stringify(shortcuts)); } catch (e) {} }
function keyLabel(code) { return 'Alt + ' + String(code || '').replace(/^Key/, ''); }

function openShortcutsModal() {
  let ov = document.getElementById('shortcuts-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.className = 'modal-overlay'; ov.id = 'shortcuts-overlay';
    ov.innerHTML = '<div class="modal-box"><h3 class="modal-title">Keyboard shortcuts</h3>' +
      '<div id="sc-rows"></div><div class="sc-msg" id="sc-msg"></div>' +
      '<div class="sc-fixed">Ctrl + arrows resize the active highlight (right edge: left/right, left edge: up/down). Ctrl + click a highlight to select it for resizing. Esc leaves resize mode. Alt+H also highlights selected text in Read mode. Enter continues a list. Alt+N on a numbered list that is out of order renumbers it; on an ordered list it removes the numbers. Ctrl+S saves, Ctrl+E switches Edit and Read.</div>' +
      '<div class="modal-actions"><button type="button" class="btn ghost small" id="sc-reset">Reset</button><button type="button" class="btn solid small" id="sc-close">Done</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', (e) => { if (e.target === ov) closeShortcutsModal(); });
    document.getElementById('sc-close').onclick = closeShortcutsModal;
    document.getElementById('sc-reset').onclick = () => { shortcuts = Object.assign({}, SHORTCUT_DEFAULTS); saveShortcuts(); renderShortcutRows(); };
  }
  document.getElementById('sc-msg').textContent = '';
  renderShortcutRows();
  ov.classList.add('open');
}
function closeShortcutsModal() {
  const ov = document.getElementById('shortcuts-overlay');
  if (ov) ov.classList.remove('open');
  document.removeEventListener('keydown', captureShortcut, true);
}
let capturing = null;
function renderShortcutRows() {
  const box = document.getElementById('sc-rows');
  box.innerHTML = '';
  Object.keys(SHORTCUT_LABELS).forEach(k => {
    const row = document.createElement('div');
    row.className = 'sc-row';
    const label = document.createElement('span');
    label.textContent = SHORTCUT_LABELS[k];
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'sc-key'; btn.setAttribute('data-a', k);
    btn.textContent = capturing === k ? 'Press Alt + a letter' : keyLabel(shortcuts[k]);
    btn.onclick = () => { capturing = k; renderShortcutRows(); document.addEventListener('keydown', captureShortcut, true); };
    row.appendChild(label); row.appendChild(btn); box.appendChild(row);
  });
}
function captureShortcut(e) {
  if (!capturing) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); capturing = null; document.removeEventListener('keydown', captureShortcut, true); renderShortcutRows(); return; }
  if (['Control', 'Alt', 'Shift', 'Meta'].indexOf(e.key) !== -1) return;
  e.preventDefault(); e.stopPropagation();
  const msg = document.getElementById('sc-msg');
  if (!e.altKey || !/^Key[A-Z]$/.test(e.code)) { msg.textContent = 'Use Alt together with a letter.'; return; }
  const clash = Object.keys(shortcuts).find(k => k !== capturing && shortcuts[k] === e.code);
  if (clash) { msg.textContent = keyLabel(e.code) + ' is already used for ' + SHORTCUT_LABELS[clash] + '.'; return; }
  shortcuts[capturing] = e.code;
  saveShortcuts();
  capturing = null;
  msg.textContent = '';
  document.removeEventListener('keydown', captureShortcut, true);
  renderShortcutRows();
}

document.addEventListener('keydown', onFmtKeydown, true);
document.addEventListener('keydown', onReadKeydown);
document.addEventListener('input', onFmtInput, true);
document.addEventListener('contextmenu', onFmtContextMenu, true);
document.addEventListener('click', onFmtClick, true);
document.addEventListener('focusin', (e) => { if (isFmtTextarea(e.target)) e.target._prevVal = e.target.value; });
document.addEventListener('mousedown', (e) => { if (hlActive && !e.ctrlKey) hlActive = null; }, true);
document.getElementById('content-inner').addEventListener('contextmenu', onReadContextMenu);
document.getElementById('content-inner').addEventListener('click', onReadClick);
