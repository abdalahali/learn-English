function buildWritingCard(sec) {
  const card = document.createElement('section');
  card.className = 'section-card'; card.id = 'card-' + sec.id;
  card.style.borderTopColor = sec.color;
  card.appendChild(buildSectionHead(sec));

  const body = document.createElement('div');
  body.className = 'section-body';

  if (!isEditMode) {
    const preview = document.createElement('div');
    preview.className = 'writing-preview';
    if (!sec.content || !sec.content.trim()) {
      preview.innerHTML = '<span class="empty-hint">Empty section. Switch to Edit mode in the topbar to write\u2026</span>';
    } else {
      preview.innerHTML = renderRich(sec.content, { color: sec.color, tgt: 'w:' + sec.id });
    }
    body.appendChild(preview);
  } else {
    const toolbar = document.createElement('div');
    toolbar.className = 'writing-toolbar';
    if (sec.showWordCount === false) {
      toolbar.style.display = 'none';
    }
    const count = document.createElement('span');
    count.className = 'word-count';
    toolbar.appendChild(count);
    body.appendChild(toolbar);

    const textarea = document.createElement('textarea');
    textarea.className = 'writing-area';
    const sp = splitContent(sec.content || '');
    textarea.value = sp.display; textarea._bc = sp.bc; textarea._dispVal = sp.display;
    textarea.placeholder = 'Write here\u2026';
    textarea.spellcheck = false;
    textarea.setAttribute('autocorrect', 'off');
    textarea.setAttribute('autocapitalize', 'off');
    textarea.setAttribute('data-gramm', 'false');

    function updateCount() {
      const n = countWords(textarea.value);
      count.textContent = n + (n === 1 ? ' word' : ' words');
    }
    updateCount();

    textarea.oninput = () => { syncMeta(textarea); sec.content = composeContent(textarea.value, textarea._bc); autoGrow(textarea); updateCount(); markDirty(); };
    body.appendChild(textarea);
    requestAnimationFrame(() => autoGrow(textarea));
  }

  card.appendChild(body);
  return card;
}

function buildTableCard(sec) {
  const card = document.createElement('section');
  card.className = 'section-card'; card.id = 'card-' + sec.id;
  card.style.borderTopColor = sec.color;
  card.appendChild(buildSectionHead(sec));

  const body = document.createElement('div');
  body.className = 'section-body';
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'table-scroll';
  const table = document.createElement('div');
  table.className = 'data-table';

  const headRow = document.createElement('div');
  headRow.className = 't-row head-row';
  const numHead = document.createElement('div');
  numHead.className = 'row-num head';
  numHead.textContent = '#';
  headRow.appendChild(numHead);
  sec.columns.forEach(col => {
    const cell = document.createElement('div');
    cell.className = 't-cell';
    const colHead = document.createElement('div');
    colHead.className = 'col-header';
    colHead.style.setProperty('--col', col.color);
    const dot = document.createElement('button');
    dot.type = 'button'; dot.className = 'col-color-dot'; dot.title = 'Column color';
    dot.style.background = col.color;
    if (!isEditMode) {
      dot.style.display = 'none';
    } else {
      dot.onclick = () => openColorPopover(dot, col.color, (color) => {
        col.color = color; dot.style.background = color;
        colHead.style.setProperty('--col', color);
        nameInput.style.color = color; markDirty();
      });
    }
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.className = 'col-name-input'; nameInput.value = col.name; nameInput.style.color = col.color;
    nameInput.placeholder = 'Column name';
    nameInput.spellcheck = false; nameInput.setAttribute('autocomplete', 'off');
    if (!isEditMode) nameInput.readOnly = true;
    nameInput.oninput = () => { col.name = nameInput.value; markDirty(); };
    const delColBtn = document.createElement('button');
    delColBtn.type = 'button'; delColBtn.className = 'col-delete-btn'; delColBtn.title = 'Delete column';
    delColBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    delColBtn.onclick = () => deleteColumn(sec, col.id);
    if (!isEditMode) delColBtn.style.display = 'none';
    colHead.appendChild(dot); colHead.appendChild(nameInput); colHead.appendChild(delColBtn);
    cell.appendChild(colHead); headRow.appendChild(cell);
  });
  const headSpacer = document.createElement('div');
  headSpacer.className = 'row-controls-cell head';
  headRow.appendChild(headSpacer);
  table.appendChild(headRow);

  sec.rows.forEach((row, rowIndex) => {
    const tr = document.createElement('div');
    tr.className = 't-row';
    const numEl = document.createElement('div');
    numEl.className = 'row-num';
    numEl.textContent = String(rowIndex + 1);
    tr.appendChild(numEl);
    sec.columns.forEach(col => {
      const cell = document.createElement('div');
      cell.className = 't-cell';
      if (!isEditMode) {
        const view = document.createElement('div');
        view.className = 'cell-view';
        view.setAttribute('data-ph', col.name || '');
        view.setAttribute('data-row', row.id);
        const txt = row.cells[col.id] || '';
        if (txt.trim()) view.innerHTML = renderRich(txt, { color: col.color, tgt: 'c:' + sec.id + ':' + row.id + ':' + col.id });
        cell.appendChild(view); tr.appendChild(cell);
        return;
      }
      const ta = document.createElement('textarea');
      ta.className = 'cell-input'; const sp = splitContent(row.cells[col.id] || ''); ta.value = sp.display; ta._bc = sp.bc; ta._dispVal = sp.display; ta.rows = 1;
      ta.spellcheck = false; ta.setAttribute('autocorrect', 'off'); ta.setAttribute('autocapitalize', 'off');
      ta.setAttribute('data-row', row.id); ta.placeholder = col.name || 'Type here\u2026';
      if (!isEditMode) ta.readOnly = true;
      ta.oninput = () => { syncMeta(ta); row.cells[col.id] = composeContent(ta.value, ta._bc); autoGrow(ta); markDirty(); };
      ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { if (!isEditMode || isFileLocked) return; e.preventDefault(); addRow(sec, row.id); } };
      cell.appendChild(ta); tr.appendChild(cell);
      requestAnimationFrame(() => autoGrow(ta));
    });
    const rowCtrl = document.createElement('div');
    rowCtrl.className = 'row-controls-cell';
    const delRowBtn = document.createElement('button');
    delRowBtn.type = 'button'; delRowBtn.className = 'row-delete-btn'; delRowBtn.title = 'Delete row';
    delRowBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    delRowBtn.onclick = () => deleteRow(sec, row.id);
    if (!isEditMode) delRowBtn.style.display = 'none';
    rowCtrl.appendChild(delRowBtn); tr.appendChild(rowCtrl);
    table.appendChild(tr);
  });

  scrollWrap.appendChild(table);
  body.appendChild(scrollWrap);

  const footerRow = document.createElement('div');
  footerRow.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin-top:8px; gap:10px;';
  if (!isEditMode) footerRow.style.display = 'none';
  const addRowBtn = document.createElement('button');
  addRowBtn.type = 'button'; addRowBtn.className = 'btn ghost small';
  addRowBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add row</span>';
  addRowBtn.onclick = () => addRow(sec);
  const addColBtn = document.createElement('button');
  addColBtn.type = 'button'; addColBtn.className = 'table-add-col-btn'; addColBtn.title = 'Add column';
  addColBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
  addColBtn.onclick = () => addColumn(sec);
  footerRow.appendChild(addRowBtn); footerRow.appendChild(addColBtn);
  body.appendChild(footerRow);

  card.appendChild(body);
  return card;
}

/* =====================================================================
   ADD SECTION MODAL
===================================================================== */
let pendingType = 'writing';
function openAddSectionModal() {
  if (guardLocked()) return;
  pendingType = 'writing';
  document.querySelectorAll('.type-choice').forEach(b => b.classList.remove('selected'));
  document.querySelector('.type-choice[data-type="writing"]').classList.add('selected');
  document.getElementById('new-section-title').value = '';
  document.getElementById('add-section-overlay').classList.add('open');
  setTimeout(() => document.getElementById('new-section-title').focus(), 60);
}
function closeAddSectionModal() { document.getElementById('add-section-overlay').classList.remove('open'); }
document.querySelectorAll('.type-choice').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    document.querySelectorAll('.type-choice').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    pendingType = btn.getAttribute('data-type');
  });
});
document.getElementById('btn-cancel-add-section').onclick = closeAddSectionModal;
document.getElementById('add-section-overlay').addEventListener('click', e => { if (e.target.id === 'add-section-overlay') closeAddSectionModal(); });
document.getElementById('btn-confirm-add-section').onclick = () => {
  const title = document.getElementById('new-section-title').value.trim();
  closeAddSectionModal();
  addSection(pendingType, title);
};
document.getElementById('new-section-title').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-confirm-add-section').click(); }
});
document.getElementById('btn-add-section').onclick = openAddSectionModal;
document.getElementById('btn-new-file-in-workspace').onclick = createFileInWorkspace;
document.getElementById('btn-files-back').onclick = () => setSidebarMode('sections');

/* =====================================================================
   CUSTOMIZE APPEARANCE MODAL
===================================================================== */
function buildDefaultColorSwatches(gridId, currentColor, onPick) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  DEFAULT_PALETTE.forEach(color => {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'swatch' + (color.toLowerCase() === String(currentColor).toLowerCase() ? ' selected' : '');
    sw.style.background = color;
    sw.onclick = () => { onPick(color); buildDefaultColorSwatches(gridId, color, onPick); };
    grid.appendChild(sw);
  });
}
function openEditModal() {
  if (guardLocked()) return;
  const s = Object.assign(defaultSettings(), doc.settings || {});
  document.getElementById('dark-mode-toggle').checked = s.theme === 'dark';

  const writingCustom = document.getElementById('custom-writing-color-input');
  if (writingCustom) {
    writingCustom.value = /^#[0-9a-fA-F]{6}$/.test(s.writingColor) ? s.writingColor : '#7A2E38';
    writingCustom.oninput = () => {
      const color = writingCustom.value;
      doc.settings = Object.assign(defaultSettings(), doc.settings, { writingColor: color });
      applyTheme(); markDirty();
      buildDefaultColorSwatches('writing-swatch-grid', color, (c) => {
        writingCustom.value = c;
        doc.settings = Object.assign(defaultSettings(), doc.settings, { writingColor: c });
        applyTheme(); markDirty();
      });
    };
  }

  const tableCustom = document.getElementById('custom-table-color-input');
  if (tableCustom) {
    tableCustom.value = /^#[0-9a-fA-F]{6}$/.test(s.tableColor) ? s.tableColor : '#2F5233';
    tableCustom.oninput = () => {
      const color = tableCustom.value;
      doc.settings = Object.assign(defaultSettings(), doc.settings, { tableColor: color });
      applyTheme(); markDirty();
      buildDefaultColorSwatches('table-swatch-grid', color, (c) => {
        tableCustom.value = c;
        doc.settings = Object.assign(defaultSettings(), doc.settings, { tableColor: c });
        applyTheme(); markDirty();
      });
    };
  }

  buildDefaultColorSwatches('writing-swatch-grid', s.writingColor, (color) => {
    if (writingCustom) writingCustom.value = color;
    doc.settings = Object.assign(defaultSettings(), doc.settings, { writingColor: color });
    applyTheme(); markDirty();
  });
  buildDefaultColorSwatches('table-swatch-grid', s.tableColor, (color) => {
    if (tableCustom) tableCustom.value = color;
    doc.settings = Object.assign(defaultSettings(), doc.settings, { tableColor: color });
    applyTheme(); markDirty();
  });
  const modalReorderBtn = document.getElementById('btn-modal-reorder');
  if (modalReorderBtn) {
    modalReorderBtn.onclick = () => {
      document.getElementById('customize-overlay').classList.remove('open');
      toggleReorderMode();
    };
  }
  renderModalFilesList();
  document.getElementById('customize-overlay').classList.add('open');
}
document.getElementById('dark-mode-toggle').addEventListener('change', (e) => {
  doc.settings = Object.assign(defaultSettings(), doc.settings, { theme: e.target.checked ? 'dark' : 'light' });
  applyTheme(); markDirty();
});
document.getElementById('btn-customize-done').onclick = () => document.getElementById('customize-overlay').classList.remove('open');
document.getElementById('customize-overlay').addEventListener('click', e => { if (e.target.id === 'customize-overlay') e.target.classList.remove('open'); });

function toggleReorderMode() {
  reorderMode = !reorderMode;
  renderSidebar();
  if (reorderMode && typeof setDrawer === 'function') setDrawer(true);
}
document.getElementById('btn-reorder-done').onclick = () => { reorderMode = false; renderSidebar(); };

/* =====================================================================
   SETTINGS BUTTON
===================================================================== */
const btnSettings = document.getElementById('btn-settings');
if (btnSettings) {
  btnSettings.onclick = (e) => {
    e.stopPropagation();
    const menu = document.getElementById('settings-menu');
    if (menu && menu.classList.contains('open')) {
      hideSettingsMenu();
    } else {
      openSettingsMenu(btnSettings);
    }
  };
}

/* =====================================================================
   FULLSCREEN
===================================================================== */
(function setupFullscreen() {
  const btn = document.getElementById('btn-fullscreen');
  const docEl = document.documentElement;
  const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
  const exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (!requestFS || !exitFS) { btn.style.display = 'none'; return; }
  function currentFsElement() { return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null; }
  function updateIcon() {
    const isFs = !!currentFsElement();
    btn.innerHTML = isFs
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4a2 2 0 0 1-2 2H3"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/><path d="M9 21v-4a2 2 0 0 0-2-2H3"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  }
  btn.onclick = () => {
    try {
      if (!currentFsElement()) { const p = requestFS.call(docEl); if (p && p.catch) p.catch(() => {}); }
      else { const p = exitFS.call(document); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  };
  document.addEventListener('fullscreenchange', updateIcon);
  document.addEventListener('webkitfullscreenchange', updateIcon);
  document.addEventListener('MSFullscreenChange', updateIcon);
})();

/* =====================================================================
   RESIZE: keep auto-growing textareas correctly sized
===================================================================== */
let resizeTimer = null;
window.addEventListener('resize', () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    document.querySelectorAll('textarea.writing-area, textarea.cell-input').forEach(autoGrow);
  }, 150);
});

/* =====================================================================
   TOPBAR TITLE + SHORTCUTS
===================================================================== */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveFile(true);
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e') {
    e.preventDefault();
    if (isFileLocked) {
      showAlert('This file is locked. Unlock it in Settings to enable editing.', 'File locked');
      return;
    }
    isEditMode = !isEditMode;
    saveToLocalStorage();
    renderAll();
  }
});

/* =====================================================================
   PHONE DRAWER (sections list) + INSTALL AS APP + OFFLINE
===================================================================== */
const mqMobile = window.matchMedia('(max-width: 859px)');
function isMobile() { return mqMobile.matches; }
function setDrawer(open) { document.body.classList.toggle('drawer-open', !!open && isMobile()); }
function closeDrawerAndReorder() {
  setDrawer(false);
  if (reorderMode) { reorderMode = false; renderSidebar(); }
}
document.getElementById('btn-menu').onclick = () => setDrawer(!document.body.classList.contains('drawer-open'));
document.getElementById('sidebar-backdrop').onclick = closeDrawerAndReorder;
document.getElementById('sidebar').addEventListener('click', (e) => {
  if (!isMobile() || reorderMode) return;
  if (e.target.closest && e.target.closest('.nav-item, #btn-add-section, .file-item')) setDrawer(false);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) closeDrawerAndReorder();
});
const onViewportChange = () => { if (!mqMobile.matches) document.body.classList.remove('drawer-open'); };
if (mqMobile.addEventListener) mqMobile.addEventListener('change', onViewportChange); else if (mqMobile.addListener) mqMobile.addListener(onViewportChange);

let deferredInstallPrompt = null;
function isStandalone() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstallPrompt = e; });
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; });
function updateInstallItem() {
  const show = !isStandalone();
  const item = document.getElementById('set-install');
  const div = document.getElementById('set-install-divider');
  if (item) item.style.display = show ? 'flex' : 'none';
  if (div) div.style.display = show ? '' : 'none';
}
async function installApp() {
  if (deferredInstallPrompt) {
    const p = deferredInstallPrompt;
    deferredInstallPrompt = null;
    try { p.prompt(); await p.userChoice; } catch (e) {}
    return;
  }
  if (!/^https?:$/.test(location.protocol)) {
    await showAlert('To install the notebook it must be opened from a web address (https://\u2026), not from a file on your disk. Put the notebook folder on any free web host (GitHub Pages, Netlify, Cloudflare Pages) and open that link.', 'Open it from a web address');
    return;
  }
  const ua = navigator.userAgent || '';
  const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  await showAlert(ios
    ? 'In Safari, tap the Share button, then choose \u201cAdd to Home Screen\u201d.'
    : 'Open your browser menu and choose \u201cInstall app\u201d or \u201cAdd to Home screen\u201d. On a PC, look for the install icon at the right end of the address bar.',
    'Install Notebook');
}
document.getElementById('set-install').onclick = () => { hideSettingsMenu(); installApp(); };

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
// Ask the browser not to evict this notebook's saved data when it is short on space.
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

/* =====================================================================
   INIT
===================================================================== */
setStatus('', 'No file connected');
applyTheme();
window.addEventListener('focus', () => { checkExternalChange(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkExternalChange(); });

const restored = loadFromLocalStorage();
if (restored) {
  setStatus('saved', 'Restored from last session');
  applyTheme();
  renderAll();
}
tryReconnect();
</script>
