<title>IELTS 4-week plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#12263A;--mute:#5B6B7B;--line:#DDE3EA;--acc:#2457D6;--accbg:#E8EEFC;--ok:#1F8F5F;--okbg:#E3F4EB;--ck:#8A5A00;--ckbg:#FBF0DC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1722;--card:#16222F;--ink:#E7EDF4;--mute:#9BAABB;--line:#2A3949;--acc:#7FA3FF;--accbg:#1B2B4D;--ok:#4FCB93;--okbg:#14352A;--ck:#F1C36B;--ckbg:#3A2D12}}
:root[data-theme="dark"]{--bg:#0E1722;--card:#16222F;--ink:#E7EDF4;--mute:#9BAABB;--line:#2A3949;--acc:#7FA3FF;--accbg:#1B2B4D;--ok:#4FCB93;--okbg:#14352A;--ck:#F1C36B;--ckbg:#3A2D12}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px}
h2{font-size:22px;margin:0}
.rule{color:var(--mute);font-size:14px;margin:0 0 16px}
.weeks,.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
button{font:inherit;color:var(--ink);cursor:pointer}
.weeks button,.days button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;min-height:44px}
.weeks small{display:block;color:var(--mute);font-size:12px}
.weeks .on{background:var(--acc);border-color:var(--acc);color:#fff}
.weeks .on small{color:#fff}
.days .on{border-color:var(--acc);background:var(--accbg);font-weight:700}
.days .full{color:var(--ok)}
.focus{margin:12px 0 14px;font-size:15px}
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px}
.tag{background:var(--ckbg);color:var(--ck);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700}
.tot{color:var(--mute);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.blk{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.blk.done{background:var(--okbg);border-color:var(--ok)}
.blk input{width:26px;height:26px;flex:none;margin:2px 0 0;accent-color:var(--ok)}
.blk label{display:flex;justify-content:space-between;gap:10px;font-size:17px}
.min{color:var(--mute);font-size:14px;white-space:nowrap}
.blk p{margin:4px 0 0;font-size:14px;color:var(--mute);max-width:60ch}
.ls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ls a{color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;text-decoration:none}
.reset{margin-top:10px;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--mute);font-size:14px}
.seg{display:flex;gap:6px;margin-bottom:16px}.seg button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px}.seg .on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}.chip.on{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 16%,transparent);font-weight:700}.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.site{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px;margin-bottom:10px}.site .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.site a,.site b{font-size:17px;font-weight:700}.site a{color:var(--ink);text-decoration-color:var(--c)}.stars{color:#D9A400;font-size:14px;letter-spacing:1px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;font-size:13px}.tg{border-radius:6px;padding:1px 8px;background:color-mix(in srgb,var(--c) 16%,transparent)}.st{border-radius:6px;padding:1px 8px;border:1px solid var(--line);color:var(--mute)}.st.plan{color:var(--ok);border-color:var(--ok)}.pr{color:var(--mute)}.site p{margin:4px 0 0;font-size:14px;color:var(--mute)}
.tip{margin-top:16px;color:var(--mute);font-size:14px}.tip summary{cursor:pointer;min-height:36px}.tip p{margin:4px 0 0;max-width:60ch}
</style></head><body><main id="app"></main>
<script>
const L={ol:["IELTS Online Tests","https://ieltsonlinetests.com/"],bbc:["BBC Learning English","https://www.bbc.co.uk/learningenglish/"],pr:["Pronounce","https://www.getpronounce.com/"],jump:["Jumpinto","https://www.jumpinto.com/"],liz:["IELTS Liz","https://ieltsliz.com/"],wi:["Write & Improve","https://writeandimprove.com/workbooks#/wi-workbooks"],w9:["Writing9","https://writing9.com/draft"],eng:["Engnovate","https://engnovate.com/"],bc:["British Council UAE","https://www.britishcouncil.ae/en/exam/ielts/prepare"],io:["IELTS.org","https://ielts.org/take-a-test/test-types/ielts-academic-test"],ipc:["IELTS Progress Check","https://ielts.idp.com/prepare/article-about-progress-check"],idp:["IDP free test","https://ielts.idp.com/prepare"],bc2:["British Council IELTS Ready","https://takeielts.britishcouncil.org/prepare/ielts-ready"]};
const D=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"];
const F=["Baseline: learn the computer format, find your weak question types, and read the band descriptors.","Weak spots: drill the question types and mistakes your error log shows most.","Timing: full 60-minute Writing on Tuesday and Friday, with planning time counted.","Simulation: full mocks in real conditions, light review, and rest before the exam."];
const $=s=>document.querySelector(s),key=(w,d,i)=>w+"-"+d+"-"+i,fmt=m=>Math.floor(m/60)+"h "+(m%60)+"m";
let S={w:0,d:0,v:"plan",f:"all",done:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("ielts-plan")||"{}"))}catch(e){}
S.r=false;if(!S.done)S.done={};
const save=()=>{try{localStorage.setItem("ielts-plan",JSON.stringify(S))}catch(e){}};
function wr(w,d){let n,m=40;
if(w>=2&&d==3){n="Full Writing: Task 1 (20 min) and Task 2 (40 min) in 60 min. Planning time counts.";m=60}
else n=(d==1||d==4)?"Two Task 1 reports, 20 min each. Planning time is not counted.":"Task 2: one essay in 40 min. Planning time is not counted.";
if(d==5)n+=" Send it to your teacher for feedback.";
return["wr","Writing",m,n,["wi","w9","io"]]}
function blocks(w,d){
const lp=["lp","Listening + pronunciation",75,"30 min: one timed IELTS section. 25 min: short clip, mark stress, record, compare (10 to 15 min imitating the speaker). 20 min: problem sounds.",["ol","jump","bbc","pr"]];
const sp=["sp","Speaking",40,"12 min: 5-word challenge. 28 min: Part 1, 2 and 3 with a timer, recorded.",["liz"]];
const rd=["rd","Reading",50,"20 min: one timed passage. 20 min: review every mistake. 10 min: collect vocabulary.",["ol","eng"]];
const vo=["vo","Vocabulary",35,"Today's words from your Vocabulary project, plus your Words to review.",[]];
const er=["er","Error log",15,"For each mistake, write why it happened: word, time, or question trap. Also log the name of every test you use so none repeats.",[]];
const W=wr(w,d);
if(w==2&&d==0)return[["pc","IELTS Progress Check (official, once)",170,"Take all four parts in real conditions. Results come in about 5 days. Skip today's other blocks.",["ipc"]],vo,er];
if(d==2)return[["ck","Checkpoint: Listening + Reading",120,"Use IELTSOnlineTests in Simulation mode: a full Listening test (30 min) and a full Reading test (60 min), then 30 min reviewing every mistake. Pick tests you have not done.",["ol"]],["pr","Pronunciation",25,"Listen, mark stress, record, compare. Spend 10 to 15 min imitating the speaker.",["pr","bbc"]],sp,W,vo,er];
if(d==5)return[lp,["sp","Speaking checkpoint",20,"Record a full test, Parts 1 to 3 (11 to 14 min), and send it to your teacher.",["liz"]],W,rd,vo,er];
if(d==6){const o=w==3,src=o?"the free IDP or British Council computer test":"an Engnovate Cambridge test you have not done",fm=o?["idp","bc2"]:["eng"];return[["m1","Mock: Listening",30,"Use "+src+". Headphones, no pausing.",fm],["m2","Mock: Reading",60,"3 passages, 40 questions, no extra time. Same source as Listening.",fm],["m3","Mock: Writing",60,"Task 1 (20 min) and Task 2 (40 min). Planning time counts.",o?fm:["wi","w9"]],["m4","Mock: Speaking",15,"Record Parts 1 to 3 and send it to your teacher.",["liz"]],["m5","Review and score",60,"Mark with the official conversion, update the error log, and pick next week's weak spots.",["io","bc"]]]}
return[lp,sp,W,rd,vo,er]}
function stat(w,d){const b=blocks(w,d);return[b.filter(x=>S.done[key(w,d,x[0])]).length,b.length,b.reduce((a,x)=>a+x[2],0)]}
function wpct(w){let n=0,t=0;for(let d=0;d<7;d++){const s=stat(w,d);n+=s[0];t+=s[1]}return Math.round(100*n/t)}
function renderPlan(){const y=scrollY,{w,d}=S,b=blocks(w,d),[n,t,m]=stat(w,d),tag=(d==2||d==5)?"Checkpoint":d==6?"Full mock":"";
$("#app").innerHTML=nav()+`<h1>IELTS plan: 4 weeks</h1>
<p class="rule">Book the exam after two full mocks in a row at about Listening 26+, Reading 27+, and Writing and Speaking 6+ from your teacher. These scores are approximate, so check the official conversion.</p>
<div class="weeks">${[0,1,2,3].map(i=>`<button class="${i==w?"on":""}" data-w="${i}">Week ${i+1}<small>${wpct(i)}%</small></button>`).join("")}</div>
<p class="focus">${F[w]}</p>
<div class="days">${D.map((x,i)=>{const s=stat(w,i),f=s[0]==s[1];return`<button class="${i==d?"on":""}${f?" full":""}" data-d="${i}">${x.slice(0,3)}${f?" ✓":""}</button>`}).join("")}</div>
<div class="dayhead"><h2>${D[d]}</h2>${tag?`<span class="tag">${tag}</span>`:""}<span class="tot">${fmt(m)}</span><span class="tot">${n} of ${t} done</span></div>
<div class="bar"><i style="width:${100*n/t}%"></i></div>
${b.map(x=>{const k=key(w,d,x[0]),c=S.done[k];return`<div class="blk${c?" done":""}"><input type="checkbox" id="c${x[0]}" data-k="${k}"${c?" checked":""}><div><label for="c${x[0]}"><b>${x[1]}</b><span class="min">${x[2]} min</span></label><p>${x[3]}</p>${x[4].length?`<div class="ls">${x[4].map(l=>`<a href="${L[l][1]}" target="_blank" rel="noopener">${L[l][0]}</a>`).join("")}</div>`:""}</div></div>`}).join("")}
<button class="reset">${S.r?"Tap again to clear all ticks":"Clear all ticks"}</button>${tip()}`;scrollTo(0,y)}
const T={exam:["Exams","#3B6FE0"],rl:["Reading and listening","#1F9D6B"],ws:["Writing and speaking","#8B5CF6"]};
const ST={plan:"In plan",opt:"Optional",try:"Try first"};
/* To add a site, add one line: [name, url, group, rating 1-5 (0 = not rated), status, price, note] */
const SITES=[
["IELTS Progress Check","https://ielts.idp.com/prepare/article-about-progress-check","exam",5,"plan","About US$50 (verify)","Official practice test marked by IELTS examiners. Take it once in week 3. Speaking uses recorded prompts."],
["British Council IELTS Ready","https://takeielts.britishcouncil.org/prepare/ielts-ready","exam",4,"plan","Free; Premium only with a booking (AED 1,590)","Free: 2 full mocks and a mini mock. The 40 scored tests unlock only when you book, so don't book just for them."],
["IDP IELTS Prepare","https://ielts.idp.com/prepare","exam",4,"plan","Free","Free computer test with answers. Use it as the week 4 Friday rehearsal."],
["IELTSOnlineTests","https://ieltsonlinetests.com/","exam",4,"plan","Free with sign-up","100+ full tests, Simulation mode, instant Listening and Reading scores. Unofficial, so treat bands as estimates."],
["Engnovate","https://engnovate.com/","exam",4,"plan","Free tier; Premium about $11.97 a month","Cambridge tests with marking. One month is enough. Its Writing and Speaking AI feedback is an estimate."],
["GoPrep","https://goprep.gg/en","exam",3,"opt","Price not shown","AI mocks with feedback on every answer. Its own site says the materials are not official. Don't pay for it and Engnovate."],
["BBC Learning English","https://www.bbc.co.uk/learningenglish/","rl",4,"plan","Free","Listening and vocabulary at your level. Good for the pronunciation clips."],
["Jumpinto","https://www.jumpinto.com/","rl",0,"try","Not checked","Practice site from your Listening list. I couldn't read its page, so judge it after you try it."],
["Read to Speak","https://readtospeakbooks.com/","rl",3,"opt","Price not shown","Shadowing method with free preview units (B1+, B2). Not IELTS format."],
["iStoria","","rl",3,"opt","","Graded stories for reading volume and vocabulary. Not IELTS question types."],
["ESL Lounge","https://www.esl-lounge.com/student/","rl",3,"opt","Free","Grammar and vocabulary at intermediate level."],
["IELTS-Up","https://ielts-up.com/index.html","rl",2,"opt","Free","Free tests and tips of mixed quality."],
["IELTS Liz","https://ieltsliz.com/","ws",5,"plan","Free","Trusted lessons for all four skills, strongest for Writing and Speaking."],
["Write & Improve","https://writeandimprove.com/workbooks#/wi-workbooks","ws",4,"plan","Free; IELTS bands need +Test Zone (about £4.50 a month)","Line-by-line feedback from Cambridge. Free gives a CEFR level, not an IELTS band."],
["Writing9","https://writing9.com/draft","ws",3,"opt","Price not verified","AI band estimate for Writing. Use it as a second opinion, not the truth."],
["Pronounce","https://www.getpronounce.com/","ws",3,"opt","Free tier; paid prices vary","AI pronunciation feedback. Worth it only if pronunciation is a weak point."],
["IELTS.org","https://ielts.org/take-a-test/test-types/ielts-academic-test","ws",3,"opt","Free","Format and band descriptors for Writing and Speaking. Information only, not a test platform."]
];
const nav=()=>`<div class="seg"><button class="${S.v!="sites"?"on":""}" data-v="plan">Plan</button><button class="${S.v=="sites"?"on":""}" data-v="sites">Sites (${SITES.length})</button></div>`;
function renderSites(){const y=scrollY,f=T[S.f]?S.f:"all";
$("#app").innerHTML=nav()+`<h1>Site directory</h1><p class="rule">Rated for your goal: IELTS Academic on computer, aiming for 6.5 to 7. Ratings are my judgment. Prices change, so check each site.</p><div class="chips"><button class="chip${f=="all"?" on":""}" data-f="all">All</button>${Object.keys(T).map(k=>`<button class="chip${f==k?" on":""}" style="--c:${T[k][1]}" data-f="${k}"><i></i>${T[k][0]}</button>`).join("")}</div>`+SITES.filter(x=>f=="all"||x[2]==f).map(([n,u,t,r,s,p,d])=>`<div class="site" style="--c:${T[t][1]}"><div class="top">${u?`<a href="${u}" target="_blank" rel="noopener">${n}</a>`:`<b>${n}</b>`}<span class="stars" aria-label="${r} out of 5">${r?"★".repeat(r)+"☆".repeat(5-r):'<em style="color:var(--mute);font-style:normal">Not rated</em>'}</span></div><div class="meta"><span class="tg">${T[t][0]}</span><span class="st ${s}">${ST[s]}</span>${p?`<span class="pr">${p}</span>`:""}</div><p>${d}</p></div>`).join("");scrollTo(0,y)}
const tip=()=>{const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);return`<details class="tip"><summary>Add to home screen</summary><p>${ios?"Open this page in Safari, tap Share, then Add to Home Screen.":"Open this page in Chrome, tap the ⋮ menu, then Install app or Add to Home screen."} Ticks are saved per browser, so open the plan from the shortcut from then on.</p></details>`};
function render(){S.v=="sites"?renderSites():renderPlan()}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.v){S.v=t.dataset.v;save();render()}
else if(t.dataset.f!=null){S.f=t.dataset.f;render()}
else if(t.dataset.w!=null){S.w=+t.dataset.w;S.r=false;save();render()}
else if(t.dataset.d!=null){S.d=+t.dataset.d;S.r=false;save();render()}
else if(t.classList.contains("reset")){if(S.r){S.done={};S.r=false;save()}else S.r=true;render()}});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;if(e.target.checked)S.done[k]=1;else delete S.done[k];save();render()});
render();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
