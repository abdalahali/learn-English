.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;font-size:13px;color:var(--mute)}.meta span{border:1px solid var(--line);border-radius:6px;padding:1px 8px}.site p{margin:4px 0 0;font-size:14px;color:var(--mute)}
.rule{color:var(--mute);font-size:14px;margin:8px 0 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="app"></main>
<script>

w1:["Writing: Task 1",["wi","io"],"Two reports, 20 min each. Planning time is not counted.","Learn the structure: overview first, then key features, no opinions. Study one band 7 model, then write one report."],
w2:["Writing: Task 2",["wi","w9"],"One essay in 40 min. Planning time is not counted.","Learn the essay types and one fixed structure. Plan for 5 min, then write one essay."],
wf:["Full Writing",["wi","w9"],"Task 1 (20 min) and Task 2 (40 min) in 60 min. Planning time counts. Send it to your teacher."],
li:["Listening",["ol","jump","bbc"],"One timed section, then review every mistake and note why it happened.","Learn the question types. Read the questions before the audio and watch spelling and plurals."],
rd:["Reading",["ol","eng"],"One timed passage (20 min), then review every mistake and collect vocabulary.","Learn the question types: skim, scan, and read True, False and Not Given carefully."],
sp:["Speaking",["liz"],"Parts 1, 2 and 3 with a timer, recorded. Listen back and note mistakes.","Learn the three parts and how to extend answers. Record one full test."],

gr:["Grammar only",[],"Rules and exercises for tenses, sentence structure and your grammar mistakes. Write 5 sentences of your own for each rule.","Learn the rules first: tenses and sentence structure, with examples."],

const P=[[["gr","gr"],["w1","w1"],["li","li"],["rd","rd"],["sp","sp"],["qt","rv"],["w2","w2"]],
[["w1","li"],["rd","sp"],["w2","rd"],["gr"],["w1","sp"],["xl","ev"],["wk","rv"]],
[["wf","li"],["rd","sp"],["li","rd"],["gr"],["wk","w2"],["m1","ev"],["ev","sp"]],
[["m2","sp"],["ev","wk"],["m3"],["gr","ev"],["wk","vr"],["m4"],["rest"]],
[["ev","wk"],["ev","wk"]]];
const nd=w=>P[w].length,$=s=>document.querySelector(s),key=(w,d,i)=>w+"-"+d+"-"+i,fmt=m=>Math.floor(m/60)+"h "+(m%60)+"m";
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SM={w1:"wr",w2:"wr",wf:"wr",li:"li",rd:"rd",sp:"sp",gr:"gr"},CV={qt:["li","rd"],xl:["li","rd"],m1:"all",m2:"all",m3:"all",m4:"all"},SKL=["li","rd","wr","sp"],SKL5=[...SKL,"gr"],GFROM=9;
const SH={gr:["Grammar",[],"One grammar point from your error book: learn the rule, then write 3 sentences of your own."],li:["Listening",["ol","jump","bbc"],"One timed section, then note each mistake and why it happened."],rd:["Reading",["ol","eng"],"One timed passage, then review the mistakes and collect vocabulary."],wr:["Writing",["wi","w9"],"A Task 1 paragraph or a Task 2 outline with an introduction. Check it against your error book."],sp:["Speaking",["liz"],"One Part 2 talk and a few Part 3 questions, recorded. Listen back for mistakes."]};
function split(p,k){const b=Math.floor(p/k/5)*5,r=(p-b*k)/5,a=[];for(let i=0;i<k;i++)a.push(b+(i>=k-r?5:0));return a}
function blocks(w,d){const it=P[w][d],u=[...new Set(it)],n=u.length,rest=it[0]=="rest",gram=it[0]=="gr",cov=new Set(),
B=[["am","Vocabulary and mistakes",45,"Your words and your error book. Review yesterday's mistakes first.",[],"Morning"],["pr","Pronunciation",15,PN[d%3],["pr","bbc"]]];
it.forEach(c=>{if(SM[c])cov.add(SM[c]);else if(CV[c]=="all")SKL.forEach(x=>cov.add(x));else if(CV[c])CV[c].forEach(x=>cov.add(x))});
it.forEach((c,i)=>{const s=SK[c],two=it.length==2&&it[0]==it[1];let t=s[0],nt=s[3]&&w==0?s[3]:s[2],m=rest?60:two?75:n==1?150:90;
if(two){t+=i?": practice":": strategy";nt=i?s[2]:s[3]}
B.push(["f"+i,t,m,nt,s[1],i?"":"Focus"])});

if(oth.length){const dist=split(oth.length==1?30:n==1?110:75,oth.length);oth.forEach((x,i)=>B.push(["s"+x,SH[x][0]+": short",dist[i],SH[x][2],SH[x][1],i?"":"Every day"]))}

B.push(["pm","Vocabulary and mistakes",45,"Review the day's new words and mistakes again.",[],"Evening"]);return B}
let S={w:0,d:0,v:"plan",f:"all",done:{},nt:{},wn:{},wstat:{},ex:"",st:"2026-11-01"};
try{Object.assign(S,JSON.parse(localStorage.getItem("ielts-plan-v2")||"{}"));if(!S.ex){const o=JSON.parse(localStorage.getItem("ielts-plan")||"{}");if(/^\d{4}-\d{2}-\d{2}$/.test(o.ex))S.ex=o.ex}}catch(e){}
["done","nt","wn","wstat"].forEach(k=>{if(!S[k]||typeof S[k]!="object"||Array.isArray(S[k]))S[k]={}});
S.rp=false;
const save=()=>{try{localStorage.setItem("ielts-plan-v2",JSON.stringify({w:S.w,d:S.d,v:S.v,done:S.done,nt:S.nt,wn:S.wn,wstat:S.wstat,ex:S.ex,st:S.st}))}catch(e){}};
const days0=s=>Math.round((new Date(new Date().toDateString())-new Date(s+"T00:00:00"))/864e5);
const flat=[];P.forEach((x,w)=>x.forEach((_,d)=>flat.push([w,d])));

function wpct(w){let n=0,t=0;for(let d=0;d<nd(w);d++){const s=stat(w,d);n+=s[0];t+=s[1]}return Math.round(100*n/t)}

<div class="chips"><span class="chip"><b>${n} of ${t}</b> blocks</span><span class="chip"><b>${fmt(m)}</b> today</span>${st?`<span class="chip w"><b>${st}</b> day streak</span>`:""}${cd()}<button class="chip" data-a="today">Go to today</button></div>
<div class="strip">${P.map((_,i)=>`<button class="${i==w?"on":""}" data-w="${i}">${i==4?"Buffer":"Week "+(i+1)}<small>${wpct(i)}%</small></button>`).join("")}</div>

const T={exam:["Exams","#3B6FE0"],rl:["Reading and listening","#1F9D6B"],ws:["Writing and speaking","#8B5CF6"]};
const SITES=[
["IELTS Progress Check","https://ielts.idp.com/prepare/article-about-progress-check","exam",5,"About US$50 (verify)","Official practice test marked by IELTS examiners. Take it once if you want an official check. Results take about 5 days."],
["British Council IELTS Ready","https://takeielts.britishcouncil.org/prepare/ielts-ready","exam",4,"Free; Premium only with a booking","Free: 2 full mocks and a mini mock. The scored tests unlock only when you book, so don't book just for them."],

function renderSites(){const y=scrollY,f=T[S.f]?S.f:"all";
$("#app").innerHTML=nav()+`<h1>Sites</h1><p class="rule">Rated for IELTS Academic on computer, aiming for 6.5 to 7. Ratings are a judgment, and prices change.</p><div class="f"><button class="chip${f=="all"?" on":""}" style="--c:#1B2A2F" data-f="all">All</button>${Object.keys(T).map(k=>`<button class="chip${f==k?" on":""}" style="--c:${T[k][1]}" data-f="${k}">${T[k][0]}</button>`).join("")}</div>`+SITES.filter(x=>f=="all"||x[2]==f).map(([n,u,t,r,p,d])=>`<div class="site" style="--c:${T[t][1]}"><div class="top">${u?`<a href="${E(u)}" target="_blank" rel="noopener">${E(n)}</a>`:`<b>${E(n)}</b>`}<span class="stars">${r?"★".repeat(r)+"☆".repeat(5-r):"Not rated"}</span></div><div class="meta"><span>${T[t][0]}</span>${p?`<span>${E(p)}</span>`:""}</div><p>${E(d)}</p></div>`).join("");scrollTo(0,y)}
const render=()=>S.v=="sites"?renderSites():renderPlan();
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1900)}
const PR=["Done. Well done.","Right on track.","One more down.","Nice work.","That counts."];
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const a=t.dataset.a;
if(a=="imp"){$("#imp").click();return}
if(a=="rep"){S.rp=!S.rp}
else if(a=="copy"){const r=$("#rt");r.select();(navigator.clipboard?navigator.clipboard.writeText(r.value):Promise.reject()).catch(()=>document.execCommand("copy"));toast("Copied");return}
else if(a=="dl"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([$("#rt").value],{type:"text/plain"}));l.download="ielts-week-"+(S.w+1)+"-report.txt";document.body.appendChild(l);l.click();l.remove();return}
else if(a=="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify({done:S.done,nt:S.nt,wn:S.wn,wstat:S.wstat,ex:S.ex,st:S.st})],{type:"application/json"}));l.download="ielts-progress.json";document.body.appendChild(l);l.click();l.remove();return}
else if(a=="clr"){if(S.r){S.done={};S.r=false;save()}else S.r=true}
else if(a=="wst"){const v=t.dataset.s;if(S.wstat[S.w]==v)delete S.wstat[S.w];else S.wstat[S.w]=v;save()}
else if(a=="today"){const i=todayI();if(i>=0){[S.w,S.d]=flat[i]}S.rp=false;save()}
else if(t.dataset.v){S.v=t.dataset.v;save()}
else if(t.dataset.f!=null){S.f=t.dataset.f}
else if(t.dataset.w!=null){S.w=+t.dataset.w;S.d=Math.min(S.d,nd(S.w)-1);S.rp=false;S.r=false;save()}
else if(t.dataset.d!=null){S.d=+t.dataset.d;S.rp=false;S.r=false;save()}
else return;render()});
document.addEventListener("input",e=>{if(e.target.id=="wnote"){const v=e.target.value;if(v.trim())S.wn[S.w]=v;else delete S.wn[S.w];save();return}if(e.target.id=="nt"){const k=S.w+"-"+S.d,v=e.target.value;if(v.trim())S.nt[k]=v;else delete S.nt[k];save()}});
document.addEventListener("change",e=>{const i=e.target.id;
if(i=="exd"||i=="std"){if(e.target.value||i=="exd"){S[i=="exd"?"ex":"st"]=e.target.value}save();return}
if(i=="imp"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),g=k=>o[k]&&typeof o[k]=="object"&&!Array.isArray(o[k])?o[k]:{};if(!o||typeof o!="object")throw 0;S.done=g("done");S.nt=g("nt");S.wn=g("wn");S.wstat=g("wstat");if(/^\d{4}-\d{2}-\d{2}$/.test(o.ex))S.ex=o.ex;if(/^\d{4}-\d{2}-\d{2}$/.test(o.st))S.st=o.st;save();render();toast("Progress imported")}catch(x){alert("This file is not a valid progress file.")}};r.readAsText(f);e.target.value="";return}
const k=e.target.dataset.k;if(!k)return;const on=e.target.checked;if(on)S.done[k]=1;else delete S.done[k];save();render();
if(on)toast(full(S.w,S.d)?"Day complete. Great work.":PR[Math.floor(Math.random()*PR.length)])});
{const i=todayI();if(i>=0&&!S.k){[S.w,S.d]=flat[i]}}
